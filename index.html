<script src="config.js"></script>
<script>
(() => {
  "use strict";

  /* ================= helpers ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => ymd(new Date());
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const addMonths = (s, n) => {
    const d = parse(s), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return ymd(d);
  };
  const fmt = (s, o) => parse(s).toLocaleDateString("en-GB", o);
  const dayOfYear = s => { const d = parse(s); return Math.round((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1; };
  const daysInYear = y => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ================= store =================
     Everything the screens need goes through this object. Today it keeps the
     days in this browser; a hosted version can swap in another implementation
     with the same methods. */
  const HEALTH = ["sleepMin", "steps", "exerciseMin", "distanceKm", "activeKcal", "standH"];
  // Bedtime and wake-up as "HH:MM". A night is kept on the day it started: in bed at 01:30 on Saturday is Friday's night.
  const TIMES = ["bedAt", "wakeAt"];
  const isClock = v => typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  const hasLine = r => !!(r && (r.line || "").trim());
  const hasBody = r => !!r && (HEALTH.some(k => r[k] != null) || TIMES.some(k => r[k]) || !!(r.workouts && r.workouts.length));
  const isBlank = r => !hasLine(r) && !(r.newThing || "").trim() && !r.mood && !hasBody(r);

  /* Workouts, as Apple Health / Fitness names them, folded into a short list of types. */
  const WO = [
    ["Walking", "🚶", /walk/], ["Running", "🏃", /run|jog/], ["Cycling", "🚴", /cycl|bik/], ["Swimming", "🏊", /swim/],
    ["Strength training", "🏋️", /strength|weight/], ["HIIT", "🔥", /hiit|high intensity|interval/], ["Yoga", "🧘", /yoga/],
    ["Pilates", "🤸", /pilates/], ["Squash", "🎾", /squash/], ["Hiking", "🥾", /hik/], ["Dance", "💃", /danc/], ["Elliptical", "⚙️", /ellip|cross trainer/],
    ["Rowing", "🚣", /row/], ["Tennis", "🎾", /tennis|padel|badminton/], ["Football", "⚽", /soccer|football/],
    ["Basketball", "🏀", /basket/], ["Climbing", "🧗", /climb|boulder/], ["Skiing", "⛷️", /ski(?!p)/], ["Snowboarding", "🏂", /snowboard/],
    ["Skating", "⛸️", /skat/], ["Martial arts", "🥋", /martial|box|kick/], ["Core training", "💪", /core/],
    ["Stretching", "🙆", /stretch|flexib|cool ?down|mobility/], ["Other", "✨", /^$/]
  ];
  // The types you log yourself, shown first when logging a workout. The rest sit under "More types".
  const WO_MAIN = ["Walking", "Running", "Cycling", "Strength training", "Yoga", "Pilates", "Squash", "Swimming", "Hiking", "Dance", "Stretching", "Other"];
  const lastWoType = () => {
    const all = Store.all(), days = Object.keys(all).sort().reverse();
    for (const d of days) { const l = all[d].workouts; if (l && l.length) return l[l.length - 1].type; }
    return "Walking";
  };
  // Pace for running, in minutes per km. It is worked out from minutes and km, so nothing extra is stored.
  const PACED = ["Running"];
  const paceOf = w => w && PACED.includes(woType(w.type)) && w.min > 0 && w.km > 0 ? w.min / w.km : null;
  const fmtPace = p => { if (!(p > 0) || p > 60) return ""; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m++; s = 0; } return `${m}:${pad(s)}`; };
  const parsePace = v => { const t = String(v || "").trim(), x = t.match(/^(\d{1,2})(?:[:.,'](\d{1,2}))?$/); if (!x) return null; const p = Number(x[1]) + (x[2] ? Number(x[2].padEnd(2, "0")) / 60 : 0); return p > 0 && p <= 60 ? p : null; };
  const woType = raw => { const s = String(raw || "").trim(), l = s.toLowerCase(); const hit = WO.find(w => w[0].toLowerCase() === l) || WO.find(w => w[2].test(l)); return hit ? hit[0] : (s.slice(0, 30) || "Other"); };
  const woIcon = type => (WO.find(w => w[0] === woType(type)) || [0, "✨"])[1];
  function cleanWorkouts(list) {
    if (!Array.isArray(list)) return undefined;
    const n = (v, max) => (typeof v === "number" && isFinite(v) && v >= 0 && v <= max) ? Math.round(v * 10) / 10 : undefined;
    const out = list.slice(0, 20).map(w => {
      if (!w || typeof w !== "object") return null;
      const o = { type: woType(w.type) };
      const m = n(w.min, 1440), k = n(w.kcal, 10000), km = n(w.km, 500);
      if (m !== undefined) o.min = Math.round(m);
      if (k !== undefined) o.kcal = Math.round(k);
      if (km !== undefined) o.km = km;
      if (typeof w.start === "string" && /^\d{2}:\d{2}$/.test(w.start)) o.start = w.start;
      // Where it came from: "health" (the morning Health Shortcut) or "shortcut" (logged with a workout Shortcut).
      if (w.src === "health" || w.src === "shortcut") o.src = w.src;
      return o.min || o.kcal || o.km ? o : null;
    }).filter(Boolean);
    return out.length ? out : undefined;
  }

  /* Extension points. music.js, flights.js and sync.js plug into these through window.Stillday. */
  const HOOKS = { change: [], wipe: [], exportParts: [], importParts: [], syncParts: [], pullParts: [] };
  const EXTRA = { actions: {}, submits: {}, changes: {}, settings: [], today: [] };
  function changed() { HOOKS.change.forEach(f => { try { f(); } catch (e) {} }); }

  const Store = (() => {
    const KEY = "stillday.days";
    let cache = null;
    const load = () => {
      if (cache) return cache;
      try { cache = JSON.parse(LS.get(KEY) || "{}") || {}; } catch (e) { cache = {}; }
      return cache;
    };
    const persist = () => LS.set(KEY, JSON.stringify(cache));
    return {
      getDay(d) { return load()[d] || null; },
      saveDay(d, patch) {
        const all = load();
        const rec = Object.assign({ date: d }, all[d], patch, { date: d, updatedAt: new Date().toISOString() });
        Object.keys(rec).forEach(k => { if (rec[k] == null || rec[k] === "" || (Array.isArray(rec[k]) && !rec[k].length)) delete rec[k]; });
        if (isBlank(rec)) delete all[d]; else all[d] = rec;
        const ok = persist(); changed(); return ok;
      },
      saveHealth(d, h) { return this.saveDay(d, h); },
      listRange(from, to) { return Object.values(load()).filter(r => r.date >= from && r.date <= to).sort((a, b) => a.date < b.date ? -1 : 1); },
      all() { return load(); },
      merge(days) { Object.assign(load(), days); const ok = persist(); changed(); return ok; },
      clear() { cache = {}; const ok = persist(); changed(); return ok; }
    };
  })();

  /* ================= ideas store ================= */
  const Ideas = (() => {
    const KEY = "stillday.ideas";
    let d = null;
    const load = () => {
      if (d) return d;
      try { d = JSON.parse(LS.get(KEY) || "null"); } catch (e) { d = null; }
      if (!d || typeof d !== "object") d = {};
      if (!Array.isArray(d.adopted)) d.adopted = [];
      if (!Array.isArray(d.custom)) d.custom = [];
      return d;
    };
    const save = () => { const ok = LS.set(KEY, JSON.stringify(d)); changed(); return ok; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return {
      get() { return load(); },
      has(id) { return load().adopted.includes(id); },
      toggle(id) { const x = load(); x.adopted = x.adopted.includes(id) ? x.adopted.filter(i => i !== id) : x.adopted.concat(id); save(); },
      add(text, topic) { load().custom.unshift({ id: uid(), text, topic: topic || "Mine", done: false }); save(); },
      done(id) { const c = load().custom.find(i => i.id === id); if (c) { c.done = !c.done; save(); } },
      del(id) { const x = load(); x.custom = x.custom.filter(i => i.id !== id); save(); },
      merge(src) {
        if (!src || typeof src !== "object") return;
        const x = load();
        if (Array.isArray(src.adopted)) src.adopted.forEach(id => { if (IDEAS.some(i => i.id === id) && !x.adopted.includes(id)) x.adopted.push(id); });
        if (Array.isArray(src.custom)) src.custom.forEach(c => {
          if (c && typeof c.text === "string" && c.text.trim() && typeof c.id === "string" && !x.custom.some(o => o.id === c.id)) x.custom.push({ id: c.id.slice(0, 40), text: c.text.slice(0, 140), topic: typeof c.topic === "string" && c.topic.trim() ? c.topic.trim().slice(0, 30) : "Mine", done: !!c.done });
        });
        save();
      },
      clear() { d = { adopted: [], custom: [] }; save(); }
    };
  })();

  /* ================= settings & theme ================= */
  // The three looks. The colours here are only for the little previews in Settings.
  const STYLES = [
    ["fun", "Fun", "Bold pastels", ["#ffe066", "#ffc4de", "#c7cffb", "#17151a"]],
    ["subtle", "Subtle", "Soft lavender", ["#e8e7fa", "#fbf1cc", "#8a8fdc", "#2a2c57"]],
    ["natural", "Natural", "Sage and peach", ["#dcecd4", "#fde2cd", "#7fb98a", "#2f5e46"]]
  ];
  let settings = { theme: "auto", style: "fun", remindOn: false, remindAt: "21:00", sleepGoalH: 7, stepGoal: 8000 };
  try { Object.assign(settings, JSON.parse(LS.get("stillday.settings") || "{}") || {}); } catch (e) {}
  if (!STYLES.some(s => s[0] === settings.style)) settings.style = "fun";
  delete settings.accent;
  const saveSettings = () => LS.set("stillday.settings", JSON.stringify(settings));
  const lightMq = matchMedia("(prefers-color-scheme: light)");

  function applyTheme() {
    const t = settings.theme === "auto" ? (lightMq.matches ? "day" : "night") : settings.theme;
    const h = document.documentElement;
    h.dataset.theme = t;
    h.dataset.style = settings.style;
    h.style.removeProperty("--accent");
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.content = getComputedStyle(h).getPropertyValue("--bg").trim() || (t === "day" ? "#fbf5e9" : "#131116");
  }
  lightMq.addEventListener("change", applyTheme);

  /* ================= state ================= */
  const S = { tab: "today", lastJournal: "today", date: today(), year: new Date().getFullYear(), range: "week", off: 0, dows: [], from: null, to: null, lastToday: today(), ideaTopic: "all" };

  /* Five sections in the bar; Today, Rewind and Year share the Journal section. */
  const NAV = { journal: ["today", "rewind", "year"], body: ["body"], music: ["music"], flights: ["flights"], insights: ["insights"], ideas: ["ideas"] };
  const NAV_META = [

  const fmtSleep = m => m == null ? null : `${Math.floor(m / 60)}h ${pad(Math.round(m % 60))}m`;

  /* ================= sleep clock =================
     Clock times are measured in minutes after 18:00, so a night reads left to right across midnight. */
  const clockMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

  const fromEve = m => { const x = (Math.round(m) + 1080) % 1440; return `${pad(Math.floor(x / 60))}:${pad(x % 60)}`; };
  const nightLen = (bed, wake) => { const d = (clockMin(wake) - clockMin(bed) + 1440) % 1440; return d > 0 && d <= 1200 ? d : null; };
  const hhmm = dt => `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const nightOfBed = dt => ymd(new Date(dt.getTime() - 12 * 36e5));   // before noon counts as the night before

  // "Going to bed" and "I'm awake" taps. The open night lives in this browser until you wake up.
  const Sleep = {
    KEY: "stillday.sleep",
    get() { try { return JSON.parse(LS.get(this.KEY) || "{}") || {}; } catch (e) { return {}; } },
    set(s) { LS.set(this.KEY, JSON.stringify(s)); },
    pending() { const p = this.get().pending; return p && Date.now() - p.at >= 0 && Date.now() - p.at <= 20 * 36e5 ? p : null; },
    bed(dt) {
      const s = this.get(), at = dt.getTime(), last = s.last;
      // Back in bed within 90 minutes of getting up: the same night carries on.
      if (last && at - last.at >= 0 && at - last.at < 90 * 6e4) s.pending = { at, night: last.night, firstBed: last.bed || hhmm(new Date(at)), prevMin: last.min || 0 };
      else {
        s.pending = { at, night: nightOfBed(dt), firstBed: hhmm(dt), prevMin: 0 };
        Store.saveDay(s.pending.night, { bedAt: s.pending.firstBed });
      }
      this.set(s);
      return s.pending;
    },
    wake(dt) {
      const s = this.get(), at = dt.getTime(), p = this.pending(), wake = hhmm(dt);

    },

      if (p && !p.prevMin) { const r = Store.getDay(p.night) || {}; if (r.bedAt === p.firstBed && !r.wakeAt) Store.saveDay(p.night, { bedAt: null }); }
    }

  const MOODS = ["Heavy", "Low", "Okay", "Good", "Bright"];
  const doneList = r => [["Line", hasLine(r)], ["New", !!(r.newThing || "").trim()], ["Mood", !!r.mood], ["Body", HEALTH.some(k => r[k] != null) || TIMES.some(k => r[k])]];
  function updateDone() {
    const el = $("#done"); if (!el) return;

  function dayLeft() {
    const n = new Date(), m = n.getHours() * 60 + n.getMinutes(), left = 1440 - m;

    let d = today(), n = 0;

  /* ================= empty days ================= */
  // The first day with a line: empty days before it don't count as missed.
  const firstLine = () => Object.keys(Store.all()).filter(k => hasLine(Store.getDay(k))).sort()[0] || null;
  function missingDays(from, to, max) {
    const out = [], start = firstLine();
    if (!start) return out;
    if (from < start) from = start;
    for (let d = to; d >= from && out.length < (max || 400); d = addDays(d, -1)) if (!hasLine(Store.getDay(d))) out.push(d);
    return out;
  }
  // Two rows of seven days on Today: the last fortnight, with empty days marked.
  function catchupCard(d) {
    const t = today(), start = firstLine();
    if (!start) return "";
    const days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
    const miss = days.filter(x => x !== t && x >= start && !hasLine(Store.getDay(x)));
    if (!miss.length) return "";
    return `<section class="section"><div class="card catchup">
      <div class="row">
        <div><b>${miss.length} empty day${miss.length === 1 ? "" : "s"}</b><div class="sub">in the last two weeks. Tap a day, or fill them all at once.</div></div>
        <button class="chip accent" data-act="catchup">Fill in</button>
      </div>
      <div class="strip">${days.map(x => {
        const r = Store.getDay(x), cls = x === t ? "today" : hasLine(r) ? "has" : x < start ? "pre" : "miss";
        return `<button class="sd ${cls} ${x === d ? "cur" : ""}" data-act="open-day" data-date="${x}" aria-label="${esc(fmt(x, { weekday: "long", day: "numeric", month: "long" }))}${cls === "miss" ? ", empty" : ""}"><small>${esc(fmt(x, { weekday: "narrow" }))}</small><b>${parse(x).getDate()}</b></button>`;
      }).join("")}</div>
    </div></section>`;
  }
  // A sheet listing empty days, each with a line field and mood dots. Enter saves and moves on.
  let catchDirty = false;
  function catchupSheet(from, to, title) {
    const miss = missingDays(from, to, 60);
    openSheet(`
      <div class="sheet-head"><h2>${esc(title || "Fill in empty days")}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      ${miss.length ? `<p class="sub">Type a line and press Enter. It saves straight away and jumps to the next day.</p>
      <div class="catch">${miss.map(d => `<div class="cu" data-row="${d}">
        <div class="cu-h"><span class="eyebrow">${esc(fmt(d, { weekday: "short", day: "numeric", month: "short", year: parse(d).getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }))}</span><span class="cu-ok">${ICON.tick} Saved</span></div>
        <input class="inp" data-catch="${d}" maxlength="280" placeholder="What happened that day?" autocomplete="off" enterkeyhint="next">
        <div class="cu-m" role="group" aria-label="Mood">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-act="catch-mood" data-date="${d}" data-mood="${n}" aria-label="${MOODS[n - 1]}" title="${MOODS[n - 1]}"><i style="width:${6 + n * 2}px;height:${6 + n * 2}px"></i></button>`).join("")}</div>
      </div>`).join("")}</div>` : `<div class="empty"><b style="font-size:18px">All caught up</b><p>Every day here has a line.</p></div>`}`);
    const first = $("#sheet [data-catch]"); if (first && matchMedia("(hover: hover)").matches) first.focus();
  }
  function saveCatch(el) {
    const d = el.dataset.catch, v = el.value.trim();
    if (!v) return false;
    const ok = Store.saveDay(d, { line: v });
    if (ok) { catchDirty = true; const row = el.closest(".cu"); if (row) row.classList.add("done"); }
    return ok;
  }

  /* The sleep buttons on Today: Going to bed in the evening, I'm awake in the morning. No watch needed. */
  function sleepCard() {
    const p = Sleep.pending(), h = new Date().getHours();
    const card = (title, sub, btns) => `<div class="card sleep-card ${p ? "on" : ""}"><div class="sc-tx"><b>${title}</b><span class="sub">${sub}</span></div><div class="sc-act">${btns}</div></div>`;
    if (p) {
      const mins = p.prevMin + Math.max(0, Math.round((Date.now() - p.at) / 6e4));
      return card(`Asleep since ${esc(p.firstBed)}`, `${fmtSleep(mins)} so far`, `<button class="chip" data-act="sleep-cancel">Cancel</button><button class="chip accent" data-act="sleep-wake">I'm awake</button>`);
    }
    const morning = h >= 3 && h < 14, last = Store.getDay(addDays(today(), -1)) || {};
    if (morning) return last.wakeAt ? "" : card("Good morning", last.bedAt ? `In bed from ${esc(last.bedAt)}. Tap when you're up.` : "Tap when you're up, then add when you went to bed.", `<button class="chip accent" data-act="sleep-wake">I'm awake</button>`);
    return card("Off to bed?", "Tap when the light goes off, and I'm awake in the morning.", `<button class="chip accent" data-act="sleep-bed">Going to bed</button>`);
  }

  /* ================= views ================= */
  function viewToday() {
    const d = S.date, t = today(), isToday = d === t, r = Store.getDay(d) || {};

    const prev = addDays(d, -1), pr = Store.getDay(prev) || {};

    const back = [[addMonths(d, -12), "A year ago"], [addMonths(d, -1), "A month ago"], [addDays(d, -7), "A week ago"]]
      .map(([x, l]) => [x, l, Store.getDay(x)]).find(x => hasLine(x[2]));
    const doy = dayOfYear(d), diy = daysInYear(y), pct = doy / diy * 100, sk = isToday ? streak() : 0;

    return `
    <section class="hero hero-card">

        <div>
          <div class="eyebrow">${esc(fmt(d, { weekday: "long" }))} · ${isToday ? greeting() : esc(String(y))}</div>
          <h1>${esc(fmt(d, { day: "numeric", month: "long" }))}</h1>
          <p class="sub hero-sub">${isToday ? (sk ? `<b>${sk}</b> day${sk === 1 ? "" : "s"} in a row` : "A fresh page") : ago === 1 ? "Yesterday" : `${fmtNum(ago)} days ago`}</p>
        </div>
        <div class="ring" title="Day ${doy} of ${diy}, ${Math.round(pct)}% of the year">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${(100 - pct).toFixed(2)}"/></svg>
          <div><b>${doy}</b><small>of ${diy}</small></div>
        </div>
      </div>
      ${isToday ? `<div class="daybar" id="daybar"><div class="trk"><i style="width:${dl.pct}%"></i></div><span>${dl.txt}</span></div>` : ""}
      ${ILLO.scene()}
    </section>
    <section class="hero-after">
      <div class="hero-meta split">
        <div class="done" id="done" aria-label="Filled in for this day">${doneList(r).map(([l, on]) => `<span class="${on ? "on" : ""}">${l}</span>`).join("")}</div>
        <div class="daynav">
          ${isToday ? "" : `<button class="chip accent" data-act="goto-today">Today</button>`}
          <button class="icon-btn" data-act="prev" aria-label="Previous day" title="Previous day (←)">${ICON.left}</button>
          <button class="icon-btn" data-act="next" aria-label="Next day" title="Next day (→)" ${isToday ? "disabled" : ""}>${ICON.right}</button>
        </div>
      </div>
    </section>
    ${catchupCard(d)}
    <section class="section">
      <label class="label" for="line">${isToday ? "What will you remember about today?" : "What do you remember about this day?"}</label>
      <textarea class="field" id="line" rows="2" maxlength="280" placeholder="One line is enough.">${esc(r.line || "")}</textarea>
      <div class="field-foot">
        <span class="saved" id="saved">${ICON.tick} Saved</span>
        <span class="count" id="count"></span>
      </div>
    </section>
    <section class="section">
      <label class="label" for="newThing">Something new or different <span style="opacity:.7">(optional)</span></label>
      <input class="field" id="newThing" maxlength="140" placeholder="A new place, taste, person, route…" value="${esc(r.newThing || "")}" autocomplete="off">
    </section>
    <section class="section">
      <span class="label">How did the day feel?</span>
      <div class="moods" id="moods" role="group" aria-label="Mood">
        ${[1, 2, 3, 4, 5].map(n => `<button class="mood ${r.mood === n ? "on" : ""}" data-act="mood" data-mood="${n}" aria-label="${MOODS[n - 1]}, mood ${n} of 5" aria-pressed="${r.mood === n}">${ILLO.face(n)}<span>${MOODS[n - 1]}</span></button>`).join("")}
      </div>

      <span class="label">Body</span>
      ${isToday ? sleepCard() : ""}
      <div class="tiles">
        ${tile("Last night", fmtSleep(pr.sleepMin != null ? pr.sleepMin : pr.bedAt && pr.wakeAt ? nightLen(pr.bedAt, pr.wakeAt) : null) || (prSmall ? "–" : null), prev, prSmall)}
        ${tile("Steps", fmtNum(r.steps))}
        ${tile("Distance", r.distanceKm != null ? `${(Math.round(r.distanceKm * 10) / 10).toLocaleString("en-GB")} km` : null)}
      </div>

        <button class="wo-chip add" data-act="wo-add" data-date="${d}">+ Workout</button>

    ${back ? `<section class="section">

        <div class="eyebrow">${esc(fmt(back[0], { weekday: "short", day: "numeric", month: "short", year: "numeric" }))}</div>
        <p class="quote">${esc(back[2].line)}</p>
      </button>
    </section>` : ""}`;
  }

  function viewRewind() {
    const t = today(), isSunday = new Date().getDay() === 0;

    const monthStart = t.slice(0, 8) + "01";

            ${hasLine(r) ? `<p class="quote">${esc(r.line)}</p>${r.newThing ? `<span class="new-tag">New: ${esc(r.newThing)}</span>` : ""}`

            ${hasLine(r) ? `<p class="quote">${esc(r.line)}</p>` : `<p class="quote none">Nothing written for this day yet.</p>`}
          </button>`; }).join("")}

      <h2>New this month</h2>
      <div class="stack" style="margin-top:14px">

          <div class="eyebrow">${esc(fmt(r.date, { weekday: "short", day: "numeric", month: "short" }))}</div>
          <p class="quote">${esc(r.newThing)}</p></button>`).join("")}
      </div>
    </section>` : ""}`;
  }

  function avgOf(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }

  function barsHtml(vals, max, labels, titles, cls) {
    let top = -1;
    vals.forEach((v, i) => { if (v != null && v > 0 && (top < 0 || v > vals[top])) top = i; });
    const n = vals.length, cols = `grid-template-columns:repeat(${n},minmax(0,1fr));gap:${n > 16 ? 2 : n > 8 ? 4 : 8}px`;
    return `<div class="wk ${cls || ""}" style="${cols}">${vals.map((v, i) => `<div><div class="bar"><i class="${i === top ? "peak" : ""}" title="${esc(titles[i])}" style="height:${v ? Math.max(4, v / max * 100) : 0}%;animation-delay:${i * 30}ms"></i></div><span>${labels[i]}</span></div>`).join("")}</div>`;
  }

  function yearStats(y) {
    const recs = Store.listRange(`${y}-01-01`, `${y}-12-31`), kept = recs.filter(hasLine);
    if (!kept.length) return "";
    const thisYear = new Date().getFullYear(), t = today();
    const possible = y < thisYear ? daysInYear(y) : dayOfYear(t);
    const words = kept.reduce((n, r) => n + r.line.trim().split(/\s+/).length, 0);
    const newN = recs.filter(r => (r.newThing || "").trim()).length;
    const mAvg = avgOf(recs.filter(r => r.mood).map(r => r.mood));
    let best = 0, run = 0, prev = null;
    kept.forEach(r => { run = prev && addDays(prev, 1) === r.date ? run + 1 : 1; best = Math.max(best, run); prev = r.date; });
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;

    const WD = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const wd = Array.from({ length: 7 }, () => ({ n: 0, ms: 0, mn: 0 }));
    kept.forEach(r => { const i = (parse(r.date).getDay() + 6) % 7; wd[i].n++; if (r.mood) { wd[i].ms += r.mood; wd[i].mn++; } });
    const maxN = Math.max(...wd.map(w => w.n)), topDay = wd.findIndex(w => w.n === maxN);
    let bright = -1, bestM = 0;
    wd.forEach((w, i) => { if (w.mn >= 2 && w.ms / w.mn > bestM) { bestM = w.ms / w.mn; bright = i; } });

    const MN = Array.from({ length: 12 }, (_, m) => new Date(y, m, 1).toLocaleDateString("en-GB", { month: "long" }));
    const perMonth = MN.map((_, m) => kept.filter(r => r.date.startsWith(`${y}-${pad(m + 1)}-`)).length);
    const moodMonth = MN.map((_, m) => avgOf(recs.filter(r => r.mood && r.date.startsWith(`${y}-${pad(m + 1)}-`)).map(r => r.mood)));
    const anyMood = moodMonth.some(v => v != null);

    return `
    <section class="section">
      <h2>${y} in numbers</h2>
      <div class="stat-grid" style="margin-top:14px">
        ${st(kept.length, "days kept")}
        ${st(best, "longest streak")}
        ${st(`${Math.round(kept.length / possible * 100)}%`, "of days kept")}
        ${st(mAvg == null ? "–" : mAvg.toFixed(1), "average mood, of 5")}
        ${st(fmtNum(words), "words written")}
        ${st(newN, "new things")}
      </div>
    </section>
    <section class="section">
      <div class="card">
        <span class="label" style="margin:0">Lines by weekday</span>
        <div class="sub" style="margin-top:2px">Most lines on ${WD[topDay]}s${bright >= 0 ? `, brightest mood on ${WD[bright]}s` : ""}.</div>
        ${barsHtml(wd.map(w => w.n), maxN, ["M", "T", "W", "T", "F", "S", "S"], wd.map((w, i) => `${WD[i]}: ${w.n} lines`))}
      </div>
    </section>
    <section class="section">
      <div class="card">
        <span class="label" style="margin:0">Lines per month</span>
        ${barsHtml(perMonth, Math.max(...perMonth, 1), "JFMAMJJASOND".split(""), perMonth.map((n, i) => `${MN[i]}: ${n} lines`), "m12")}
      </div>
    </section>
    ${anyMood ? `<section class="section">
      <div class="card">
        <span class="label" style="margin:0">Average mood by month</span>
        ${barsHtml(moodMonth, 5, "JFMAMJJASOND".split(""), moodMonth.map((v, i) => `${MN[i]}: ${v == null ? "no mood" : v.toFixed(1) + " of 5"}`), "m12")}
      </div>
    </section>` : ""}`;
  }

  function viewYear() {
    const y = S.year, t = today(), thisYear = new Date().getFullYear();
    const recs = Store.listRange(`${y}-01-01`, `${y}-12-31`).filter(hasLine);
    const possible = y < thisYear ? daysInYear(y) : y === thisYear ? dayOfYear(t) : 0;
    const start = firstLine();
    const yEnd = `${y}-12-31` < t ? `${y}-12-31` : addDays(t, -1);
    const missN = missingDays(`${y}-01-01`, yEnd).length;
    const months = Array.from({ length: 12 }, (_, m) => {
      const first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate(), offset = (first.getDay() + 6) % 7;
      let cells = "<span></span>".repeat(offset);
      for (let d = 1; d <= n; d++) {
        const key = `${y}-${pad(m + 1)}-${pad(d)}`, r = Store.getDay(key), has = hasLine(r);
        const cls = key > t ? "future" : has ? "has" : (start && key >= start && key < t) ? "miss" : "";
        const o = has ? (r.mood ? (0.2 + r.mood * 0.16).toFixed(2) : "0.6") : "";
        cells += `<button class="dot ${cls} ${key === t ? "now" : ""}" data-act="open-day" data-date="${key}" ${o ? `style="--o:${o}"` : ""} ${key > t ? "disabled" : ""} aria-label="${esc(fmt(key, { day: "numeric", month: "long" }))}${has ? ", written" : ""}" title="${has ? esc(r.line) : ""}"></button>`;
      }
      return `<div><div class="month-name">${first.toLocaleDateString("en-GB", { month: "long" })}</div><div class="dots" style="--m:${m}">${cells}</div></div>`;
    }).join("");
    return `
    <section class="year-head">
      <div>
        <div class="eyebrow">Every day is a dot</div>
        <h1 style="margin-top:8px">${y}</h1>
      </div>
      <div>
        <button class="icon-btn" data-act="year-prev" aria-label="Previous year" style="display:inline-grid">${ICON.left}</button>
        <button class="icon-btn" data-act="year-next" aria-label="Next year" style="display:inline-grid" ${y >= thisYear ? "disabled" : ""}>${ICON.right}</button>
      </div>
    </section>
    <p class="sub" style="margin-top:12px">${recs.length} of ${possible} days kept${y === thisYear ? ` · ${daysInYear(y) - dayOfYear(t)} still to come` : ""}. Brighter dots were brighter days${missN ? ", outlined dots are still empty" : ""}.</p>
    ${missN ? `<div class="hero-meta"><button class="chip accent" data-act="catchup-year">Fill ${missN} empty day${missN === 1 ? "" : "s"}</button></div>` : ""}
    <section class="months">${months}</section>
    ${yearStats(y)}`;
  }

  /* ================= body ================= */
  const RANGES = [["3d", "3 days", 3], ["week", "Week", 7], ["2w", "2 weeks", 14], ["month", "Month", 30], ["quarter", "3 months", 91], ["6m", "6 months", 182], ["year", "Year", 365], ["all", "All", 0], ["custom", "Custom", 0]];
  const DOW = ["M", "T", "W", "T", "F", "S", "S"], DOW_NAME = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const dowOf = d => (parse(d).getDay() + 6) % 7; // Monday = 0
  const dowOk = d => !S.dows.length || S.dows.includes(dowOf(d));
  const dowLabel = () => {
    const s = S.dows.slice().sort((a, b) => a - b).join("");
    return !s ? "" : s === "01234" ? "weekdays" : s === "56" ? "weekends" : S.dows.slice().sort((a, b) => a - b).map(i => DOW_NAME[i]).join(", ");
  };
  const span = (a, b) => Math.round((parse(b) - parse(a)) / 864e5) + 1;
  const daysFrom = (from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; };

  // The window of days the Body page shows, and how to group them into bars.
  function bodyWindow() {
    const t = today(), r = RANGES.find(x => x[0] === S.range) || RANGES[0];
    let from, to = t;
    if (r[0] === "all") {
      const ks = Object.keys(Store.all()).filter(k => hasBody(Store.getDay(k))).sort();
      from = ks[0] && ks[0] < addDays(t, -29) ? ks[0] : addDays(t, -29);
    } else if (r[0] === "custom") {
      to = S.to && S.to <= t ? S.to : t;
      from = S.from && S.from <= to ? S.from : addDays(to, -29);
    } else { to = addDays(t, -S.off * r[2]); from = addDays(to, -(r[2] - 1)); }
    let days = daysFrom(from, to);
    const n = days.length; // size of the window before the weekday filter
    let dowIgnored = false;
    if (S.dows.length) { const f = days.filter(dowOk); if (f.length) days = f; else dowIgnored = true; }
    let buckets;
    const group = keyOf => { const m = new Map(); days.forEach(d => { const k = keyOf(d); if (!m.has(k)) m.set(k, []); m.get(k).push(d); }); return [...m].map(([k, ds]) => ({ key: k, days: ds })); };
    if (n <= 31) buckets = days.map(d => ({ key: d, days: [d] }));
    else if (n <= 120) buckets = group(d => addDays(from, Math.floor((span(from, d) - 1) / 7) * 7));
    else if (n <= 1500) buckets = group(d => d.slice(0, 7));
    else buckets = group(d => d.slice(0, 4));
    const unit = n <= 31 ? "day" : n <= 120 ? "week" : n <= 1500 ? "month" : "year";
    return { from, to, days, n: days.length, raw: n, buckets, unit, kind: r[0], len: r[2], dowIgnored };
  }
  const bucketLabel = (b, unit) => unit === "day" ? fmt(b.key, { day: "numeric", month: "short" })
    : unit === "week" ? `Week of ${fmt(b.key, { day: "numeric", month: "short" })}`
    : unit === "month" ? fmt(b.key + "-01", { month: "short", year: "numeric" }) : b.key;
  const dayVal = (d, key) => { const r = Store.getDay(d); return r && r[key] != null ? Number(r[key]) : null; };

  function chart(W, key, show) {
    const vals = W.buckets.map(b => avgOf(b.days.map(d => dayVal(d, key)).filter(v => v != null)));
    const have = W.days.map(d => dayVal(d, key)).filter(v => v != null);
    const max = Math.max(1, ...vals.filter(v => v != null)), n = vals.length, VW = 300, H = 80, bw = VW / n, gap = n > 40 ? 1 : n > 10 ? 2 : 6;
    const bars = vals.map((v, i) => {
      const h = v == null ? 2 : Math.max(3, (v / max) * H), b = W.buckets[i], one = b.days.length === 1;
      const tip = `${bucketLabel(b, W.unit)}: ${v == null ? (one ? "no data, tap to add" : "no data") : (one ? "" : "average ") + show(v)}`;
      return `<rect class="${v == null ? "empty" : ""} ${one ? "tap" : ""}" ${one ? `data-act="health-day" data-date="${b.key}"` : ""} x="${(i * bw + gap / 2).toFixed(2)}" y="${(H - h).toFixed(1)}" width="${Math.max(.5, bw - gap).toFixed(2)}" height="${h.toFixed(1)}" rx="${Math.min(4, (bw - gap) / 2).toFixed(1)}" style="animation-delay:${Math.min(i, 60) * 10}ms"><title>${esc(tip)}</title></rect>`;
    }).join("");
    return { avg: avgOf(have), count: have.length, svg: `<svg viewBox="0 0 ${VW} ${H}" preserveAspectRatio="none" role="img">${bars}</svg>` };
  }

  function bodyStats(W) {
    const rows = W.days.map(d => Store.getDay(d)).filter(Boolean);
    if (!rows.some(hasBody)) return "";
    const sum = k => rows.reduce((n, r) => n + (r[k] || 0), 0);
    const best = k => rows.filter(r => r[k] != null).reduce((b, r) => !b || r[k] > b[k] ? r : b, null);
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const bs = best("steps"), bl = best("sleepMin");
    const nSteps = rows.filter(r => r.steps != null).length, hit = rows.filter(r => r.steps != null && r.steps >= settings.stepGoal).length;
    const nSleep = rows.filter(r => r.sleepMin != null).length, slept = rows.filter(r => r.sleepMin != null && r.sleepMin >= settings.sleepGoalH * 60).length;
    const dd = r => esc(fmt(r.date, { day: "numeric", month: "short" }));
    const nWo = rows.reduce((n, r) => n + ((r.workouts || []).length), 0);
    return `<section class="section"><h2>Highlights</h2><div class="stat-grid" style="margin-top:14px">
      ${st(fmtNum(sum("steps")), "steps in total")}
      ${st(`${(Math.round(sum("distanceKm") * 10) / 10).toLocaleString("en-GB")} km`, "distance in total")}
      ${st(bs ? fmtNum(bs.steps) : "–", bs ? `most steps · ${dd(bs)}` : "most steps")}
      ${st(bl ? fmtSleep(bl.sleepMin) : "–", bl ? `longest sleep · ${dd(bl)}` : "longest sleep")}
      ${st(nSteps ? `${hit}/${nSteps}` : "–", `days over ${fmtNum(settings.stepGoal)} steps`)}
      ${st(nSteps ? fmtNum(Math.round(sum("steps") / nSteps)) : "–", "steps a day on average")}
      ${st(String(nWo), nWo === 1 ? "workout" : "workouts")}
      ${nSleep ? st(`${slept}/${nSleep}`, `nights with ${settings.sleepGoalH}h+ sleep`) : ""}
      ${nSleep ? st(fmtSleep(Math.round(sum("sleepMin") / nSleep)), "average night") : ""}
    </div></section>`;
  }

  function compareMood(key, goal, label) {
    const rows = Object.values(Store.all()).filter(r => r.mood && r[key] != null);
    const hi = rows.filter(r => r[key] >= goal), lo = rows.filter(r => r[key] < goal);
    if (hi.length < 3 || lo.length < 3) return null;
    return `On days with ${label}, mood averaged <b>${avgOf(hi.map(r => r.mood)).toFixed(1)}</b> versus <b>${avgOf(lo.map(r => r.mood)).toFixed(1)}</b> on other days <span class="sub">(${hi.length} and ${lo.length} days)</span>.`;
  }

  function bodyInsights() {
    const t = today(), items = [];
    const a = compareMood("sleepMin", settings.sleepGoalH * 60, `${settings.sleepGoalH}h+ of sleep`);
    const b = compareMood("steps", settings.stepGoal, `${fmtNum(settings.stepGoal)}+ steps`);
    if (a) items.push(a);
    if (b) items.push(b);
    const wRows = Object.values(Store.all()).filter(r => r.mood);
    const withW = wRows.filter(r => r.workouts && r.workouts.length), noW = wRows.filter(r => !(r.workouts && r.workouts.length));
    if (withW.length >= 3 && noW.length >= 3) items.push(`On days you worked out, mood averaged <b>${avgOf(withW.map(r => r.mood)).toFixed(1)}</b> versus <b>${avgOf(noW.map(r => r.mood)).toFixed(1)}</b> on rest days.`);
    const sl = Store.listRange(addDays(t, -29), t).filter(r => r.sleepMin != null).map(r => r.sleepMin);
    if (sl.length >= 5) {
      const m = avgOf(sl), sd = Math.sqrt(avgOf(sl.map(x => (x - m) ** 2)));
      items.push(`Over the last 30 days your sleep length varied by about <b>${Math.round(sd)} minutes</b> from night to night.`);
    }
    const wk = Store.listRange(addDays(t, -30), t).filter(r => r.wakeAt).map(r => eveMin(r.wakeAt));
    if (wk.length >= 5) {
      const m = avgOf(wk), sd = Math.sqrt(avgOf(wk.map(x => (x - m) ** 2)));
      items.push(`You usually wake up around <b>${fromEve(m)}</b>, give or take <b>${Math.round(sd)} minutes</b>${sd <= 30 ? ". That's a steady rhythm." : "."}`);
    }
    return `<section class="section"><h2>What your numbers say</h2>
      ${items.length ? items.map(i => `<p class="insight">${i}</p>`).join("") : `<p class="sub" style="margin-top:8px">Log mood plus sleep, steps or workouts on at least 3 days either way to see patterns.</p>`}
      <p class="note">These are patterns in your own days, not proof of cause. Goals are in Settings.</p></section>`;
  }

  // Bedtime and wake-up: usual times, how steady they are, and one bar per night on an 18:00 to 14:00 line.
  function sleepTimes(W) {
    const nights = W.days.map(d => [d, Store.getDay(d) || {}]).filter(([, r]) => r.bedAt || r.wakeAt);
    const head = `<div class="row"><h2>Bedtime</h2><button class="chip" data-act="health-day" data-date="${nightOfWake(new Date()) <= W.to ? nightOfWake(new Date()) : W.to}">+ Log a night</button></div>`;
    if (!nights.length) return `<section class="section">${head}<p class="sub" style="margin-top:8px">No bedtimes in this period. Tap <b>Going to bed</b> and <b>I'm awake</b> on Today, let your iPhone log them (charger or Sleep Focus Shortcuts, no watch needed), or type them in.</p></section>`;
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const sd = xs => { const m = avgOf(xs); return Math.sqrt(avgOf(xs.map(x => (x - m) ** 2))); };
    const beds = nights.filter(([, r]) => r.bedAt).map(([, r]) => eveMin(r.bedAt)), wakes = nights.filter(([, r]) => r.wakeAt).map(([, r]) => eveMin(r.wakeAt));
    const lens = nights.map(([, r]) => r.sleepMin != null ? r.sleepMin : r.bedAt && r.wakeAt ? nightLen(r.bedAt, r.wakeAt) : null).filter(v => v != null);
    const SPAN = 1200, pos = m => (Math.min(SPAN, Math.max(0, m)) / SPAN * 100).toFixed(2);
    const ticks = [[0, "18"], [180, "21"], [360, "00"], [540, "03"], [720, "06"], [900, "09"], [1080, "12"]];
    const rows = nights.slice().reverse().slice(0, 14).map(([d, r], i) => {
      const b = r.bedAt ? eveMin(r.bedAt) : null, w = r.wakeAt ? eveMin(r.wakeAt) : null;
      // Only one end known: draw a faint hour so the night still shows up.
      const x1 = b != null ? b : w - 60, x2 = w != null && (b == null || w > b) ? w : x1 + 60;
      const len = r.sleepMin != null ? r.sleepMin : b != null && w != null ? nightLen(r.bedAt, r.wakeAt) : null;
      return `<button class="nt-row" data-act="health-day" data-date="${d}" title="${esc(`${fmt(d, { weekday: "long", day: "numeric", month: "short" })} night: ${r.bedAt || "?"} to ${r.wakeAt || "?"}`)}">
        <small>${esc(fmt(d, { weekday: "short", day: "numeric" }))}</small>
        <span class="nt-trk">${ticks.slice(1).map(([m]) => `<b style="left:${pos(m)}%"></b>`).join("")}<i class="${b == null || w == null ? "half" : ""}" style="left:${pos(x1)}%;width:${(pos(x2) - pos(x1)).toFixed(2)}%;animation-delay:${i * 30}ms"></i></span>
        <small>${len ? fmtSleep(len).replace(" ", "") : "–"}</small>
      </button>`;
    }).join("");
    return `<section class="section">${head}
      <div class="stat-grid" style="margin-top:14px">
        ${st(beds.length ? fromEve(avgOf(beds)) : "–", "usual bedtime")}
        ${st(wakes.length ? fromEve(avgOf(wakes)) : "–", "usual wake-up")}
        ${st(lens.length ? fmtSleep(Math.round(avgOf(lens))) : "–", "average night")}
        ${beds.length >= 3 ? st(`±${Math.round(sd(beds))} min`, "bedtime spread") : ""}
        ${wakes.length >= 3 ? st(`±${Math.round(sd(wakes))} min`, "wake-up spread") : ""}
        ${st(`${nights.length}/${W.n}`, "nights with times")}
      </div>
      <div class="card nights" style="margin-top:12px">
        <div class="nt-axis"><span></span><div>${ticks.map(([m, l]) => `<span style="left:${pos(m)}%">${l}</span>`).join("")}</div><span></span></div>
        ${rows}
      </div>
      ${nights.length > 14 ? `<p class="note">Showing the latest 14 nights; the numbers above cover all ${nights.length}.</p>` : ""}
    </section>`;
  }

  // Workouts in the window: totals, by type, minutes over time and a list.
  function activities(W) {
    const list = [];
    W.days.forEach(d => { const r = Store.getDay(d); (r && r.workouts || []).forEach((w, i) => list.push({ d, i, w })); });
    const head = `<div class="row"><h2>Activities</h2><button class="chip" data-act="wo-add" data-date="${W.to}">+ Log workout</button></div>`;
    if (!list.length) return `<section class="section">${head}<p class="sub" style="margin-top:8px">No workouts in this period. Tap <b>+ Log workout</b> after a training to add one.</p></section>`;
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const mins = list.reduce((n, x) => n + (x.w.min || 0), 0), kcal = list.reduce((n, x) => n + (x.w.kcal || 0), 0), km = list.reduce((n, x) => n + (x.w.km || 0), 0);
    const activeDays = new Set(list.map(x => x.d)).size;
    const types = new Map(); list.forEach(x => { const k = woType(x.w.type), t = types.get(k) || { n: 0, min: 0, km: 0, pmin: 0, pkm: 0 }; t.n++; t.min += x.w.min || 0; t.km += x.w.km || 0; if (paceOf(x.w)) { t.pmin += x.w.min; t.pkm += x.w.km; } types.set(k, t); });
    const tRows = [...types].sort((a, b) => b[1].min - a[1].min || b[1].n - a[1].n), tMax = Math.max(1, ...tRows.map(r => r[1].min || r[1].n));
    const per = W.buckets.map(b => b.days.reduce((n, d) => n + ((Store.getDay(d) || {}).workouts || []).reduce((m, w) => m + (w.min || 0), 0), 0));
    const showPer = W.buckets.length <= 31;
    return `<section class="section">${head}
      <div class="stat-grid" style="margin-top:14px">
        ${st(list.length, list.length === 1 ? "workout" : "workouts")}
        ${st(mins >= 600 ? `${fmtNum(Math.round(mins / 60))} h` : `${mins} min`, "training time")}
        ${st(`${activeDays}/${W.n}`, "active days")}
        ${kcal ? st(fmtNum(kcal), "kcal in workouts") : ""}
        ${km ? st(`${(Math.round(km * 10) / 10).toLocaleString("en-GB")} km`, "covered in workouts") : ""}
        ${st(`${Math.round(mins / list.length)} min`, "average workout")}
      </div>
      <div class="card" style="margin-top:12px;padding-top:6px;padding-bottom:6px">
        ${tRows.map(([t, v], i) => `<div class="rank"><span class="no wo-ic">${woIcon(t)}</span><div class="nm"><b>${esc(t)}</b><small>${v.n}× ${v.km ? `· ${(Math.round(v.km * 10) / 10).toLocaleString("en-GB")} km` : ""}${PACED.includes(t) && v.pkm ? ` · avg ${fmtPace(v.pmin / v.pkm)}/km` : ""}</small><div class="bar2"><i style="width:${((v.min || v.n) / tMax * 100).toFixed(1)}%;animation-delay:${i * 40}ms"></i></div></div><span class="val">${v.min ? `${fmtNum(v.min)} min` : ""}</span></div>`).join("")}
      </div>
      ${showPer ? "" : `<div class="card" style="margin-top:12px"><span class="label" style="margin:0">Training minutes per ${W.unit}</span>${barsHtml(per, Math.max(...per, 1), W.buckets.map((b, i) => W.buckets.length > 14 ? (i % Math.ceil(W.buckets.length / 7) === 0 ? bucketLabel(b, W.unit).replace("Week of ", "").split(" ")[0] : "") : bucketLabel(b, W.unit).replace("Week of ", "").split(" ").slice(0, 2).join(" ")), W.buckets.map((b, i) => `${bucketLabel(b, W.unit)}: ${per[i]} min`), "m12")}</div>`}
      <div class="stack" style="margin-top:12px">${list.slice().reverse().slice(0, 12).map(x => `<button class="card wo" data-act="wo-edit" data-date="${x.d}" data-i="${x.i}">
        <span class="wo-ic big">${woIcon(x.w.type)}</span>
        <span class="wo-tx"><b>${esc(x.w.type)}</b><small>${esc(fmt(x.d, { weekday: "short", day: "numeric", month: "short" }))}${x.w.start ? ` · ${esc(x.w.start)}` : ""}</small></span>
        <span class="wo-v">${[x.w.min ? `${x.w.min} min` : "", x.w.km ? `${x.w.km} km` : "", paceOf(x.w) ? `${fmtPace(paceOf(x.w))}/km` : "", x.w.kcal ? `${fmtNum(x.w.kcal)} kcal` : ""].filter(Boolean).join(" · ")}</span>
      </button>`).join("")}</div>
    </section>`;
  }

  // Day by day, newest first: every day can be opened to add or fix numbers.
  function dayLog(W) {
    const ds = W.days.slice(-14).reverse();
    return `<section class="section"><div class="row"><h2>Day by day</h2><span class="sub">tap a day to edit</span></div>
      <div class="card daylog" style="margin-top:12px">${ds.map(d => {
        const r = Store.getDay(d) || {}, cell = (v, l) => `<span class="${v == null ? "no" : ""}"><b>${v == null ? "–" : v}</b><small>${l}</small></span>`;
        return `<button data-act="health-day" data-date="${d}" class="${hasBody(r) ? "" : "empty"}">
          <span class="dl-d"><b>${esc(fmt(d, { weekday: "short" }))}</b><small>${esc(fmt(d, { day: "numeric", month: "short" }))}</small></span>
          ${cell((x => x != null ? fmtSleep(x).replace(" ", "") : null)(r.sleepMin != null ? r.sleepMin : r.bedAt && r.wakeAt ? nightLen(r.bedAt, r.wakeAt) : null), r.bedAt ? `sleep · ${r.bedAt}` : "sleep")}
          ${cell(r.steps != null ? (r.steps >= 10000 ? `${(Math.round(r.steps / 100) / 10).toLocaleString("en-GB")}k` : fmtNum(r.steps)) : null, "steps")}
          ${cell(r.distanceKm != null ? `${(Math.round(r.distanceKm * 10) / 10).toLocaleString("en-GB")}` : null, "km")}
          <span class="dl-w">${(r.workouts || []).slice(0, 3).map(w => woIcon(w.type)).join("") || (hasBody(r) ? "" : '<em>Add</em>')}</span>
        </button>`;
      }).join("")}</div></section>`;
  }

  /* More chart types for the Body page, drawn with charts.js: trends, distributions, weekday spread, mood and streaks. */
  const sleepOf = r => r.sleepMin != null ? r.sleepMin : r.bedAt && r.wakeAt ? nightLen(r.bedAt, r.wakeAt) : null;
  const xcard = (title, sub, body) => `<div class="card"><span class="label" style="margin:0">${title}</span>${sub ? `<div class="sub" style="margin-top:2px">${sub}</div>` : ""}${body}</div>`;
  function bodyCharts(W) {
    const X = window.Stillday.Charts; if (!X) return "";
    const rec = d => Store.getDay(d) || {};
    const goalS = settings.sleepGoalH * 60, days = W.days, t = today();
    const hrs = v => `${(v / 60).toFixed(1)}h`, sh = d => fmt(d, { day: "numeric", month: "short" });
    const daily = days.length <= 370, win = daily ? 7 : 3, per = daily ? "day" : W.unit;
    const pts = daily ? days.map(d => ({ label: sh(d), days: [d] })) : W.buckets.map(b => ({ label: bucketLabel(b, W.unit).replace("Week of ", ""), days: b.days }));
    const seriesOf = get => pts.map(p => avgOf(p.days.map(get).filter(v => v != null)));
    const labels = pts.map(p => p.label), out = [];

    // 1. Trend lines with a moving average and the goal
    const trend = (vals, name, f, goal) => X.line([
      { name: daily ? name : `${name}, ${W.unit} average`, vals, c: 0, faint: true, w: 1 },
      { name: `${win}-${per} average`, vals: X.movingAvg(vals, win), c: 0, w: 2.2 }
    ], { labels, fmt: f, hlines: [{ v: goal, label: "goal" }] });
    const sl = seriesOf(d => sleepOf(rec(d))), stp = seriesOf(d => dayVal(d, "steps"));
    if (X.nums(sl).length >= 5) out.push(xcard("Sleep trend", `The thin line is each ${daily ? "night" : W.unit}, the thick line smooths it over ${win} ${per}s. Dashed: your ${settings.sleepGoalH}h goal.`, trend(sl, "Sleep", hrs, goalS)));
    if (X.nums(stp).length >= 5) out.push(xcard("Steps trend", `Dashed: your goal of ${fmtNum(settings.stepGoal)} steps.`, trend(stp, "Steps", v => fmtNum(Math.round(v)), settings.stepGoal)));

    // 2. Sleep balance and distribution
    const nights = days.map(d => [d, sleepOf(rec(d))]).filter(x => x[1] != null);
    if (nights.length >= 5) {
      let acc = 0; const cum = nights.map(x => (acc += x[1] - goalS));
      out.push(xcard("Sleep balance", `Running total against your ${settings.sleepGoalH}h goal: <b>${acc >= 0 ? "+" : "−"}${fmtSleep(Math.abs(acc))}</b> over ${nights.length} nights. Below the dashed line is sleep owed.`,
        X.line([{ name: "Balance", vals: cum, c: acc >= 0 ? 0 : 2, area: true }], { labels: nights.map(x => sh(x[0])), fmt: v => `${v < 0 ? "−" : ""}${Math.round(Math.abs(v) / 60)}h`, base: 0, hlines: [{ v: 0 }] })));
      const vs = nights.map(x => x[1]), md = X.median(vs);
      out.push(xcard("How long you sleep", `Half of your nights fall between <b>${fmtSleep(Math.round(X.quantile(vs, .25)))}</b> and <b>${fmtSleep(Math.round(X.quantile(vs, .75)))}</b>.`,
        X.histogram(vs, { step: 30, fmt: v => fmtSleep(Math.round(v)).replace(" 00m", ""), unit: "nights", marks: [{ v: md, label: `median ${fmtSleep(Math.round(md))}` }, { v: goalS, label: "goal" }] })));
    }

    // 3. Bedtime: does it cost sleep, and is it drifting?
    const bedPts = days.map(d => { const r = rec(d), s = sleepOf(r); return r.bedAt && s != null ? { x: eveMin(r.bedAt), y: s, t: sh(d) } : null; }).filter(Boolean);
    if (bedPts.length >= 10) out.push(xcard("Bedtime against sleep length", "Each dot is a night. A line sloping down means later bedtimes cost you sleep.", X.scatter(bedPts, { xFmt: fromEve, yFmt: hrs, xLabel: "Bedtime", yLabel: "Sleep" })));
    const bed = seriesOf(d => rec(d).bedAt ? eveMin(rec(d).bedAt) : null), wake = seriesOf(d => rec(d).wakeAt ? eveMin(rec(d).wakeAt) : null);
    if (X.nums(bed).length + X.nums(wake).length >= 8) out.push(xcard("Bedtime and wake-up drift", `${win}-${per} average. Higher on the chart is later.`,
      X.line([{ name: "Wake-up", vals: X.movingAvg(wake, win), c: 0 }, { name: "Bedtime", vals: X.movingAvg(bed, win), c: 1 }], { labels, fmt: fromEve })));

    // 4. Spread by weekday
    const byDow = get => DOW_NAME.map((l, i) => ({ label: l, vals: days.filter(d => dowOf(d) === i).map(get).filter(v => v != null) }));
    if (nights.length >= 7) out.push(xcard("Sleep by weekday", "", X.range(byDow(d => sleepOf(rec(d))), { fmt: v => fmtSleep(Math.round(v)).replace(" ", ""), goal: goalS })));
    if (days.filter(d => dayVal(d, "steps") != null).length >= 7) out.push(xcard("Steps by weekday", "", X.range(byDow(d => dayVal(d, "steps")), { fmt: v => fmtNum(Math.round(v)), goal: settings.stepGoal, lo: 0 })));

    // 5. Does one thing follow another?
    const stepPts = days.map(d => { const s = sleepOf(rec(addDays(d, -1))), v = dayVal(d, "steps"); return s != null && v != null ? { x: s, y: v, t: sh(d) } : null; }).filter(Boolean);
    if (stepPts.length >= 10) out.push(xcard("Steps after a night's sleep", "Sleep the night before against steps the next day.", X.scatter(stepPts, { xFmt: hrs, yFmt: v => fmtNum(Math.round(v)), xLabel: "Sleep the night before", yLabel: "Steps" })));
    const woN = days.filter(d => sleepOf(rec(d)) != null && (rec(d).workouts || []).length).map(d => sleepOf(rec(d)));
    const restN = days.filter(d => sleepOf(rec(d)) != null && !(rec(d).workouts || []).length).map(d => sleepOf(rec(d)));
    if (woN.length >= 3 && restN.length >= 3) out.push(xcard("Sleep after a workout", "The night that follows a workout day against the night after a rest day.",
      X.paired([{ label: "Workout days", v: X.mean(woN), n: woN.length }, { label: "Rest days", v: X.mean(restN), n: restN.length, c: 1 }], { fmt: v => fmtSleep(Math.round(v)), unit: "nights" })));

    // 6. Mood
    const y = W.to.slice(0, 4), moodDays = days.filter(d => rec(d).mood);
    if (Object.keys(Store.all()).some(k => k.startsWith(y) && Store.getDay(k).mood)) out.push(xcard(`Mood through ${y}`, "Darker squares were brighter days. Tap a day to open it.",
      X.calendar(y, k => { const m = (Store.getDay(k) || {}).mood; return m ? { o: m / 5, t: MOODS[m - 1] } : null; }, { attrs: k => k <= t ? `data-act="open-day" data-date="${k}" class="tap"` : "", label: `Mood by day, ${y}` })));
    if (moodDays.length >= 7) {
      const mv = DOW_NAME.map((_, i) => avgOf(moodDays.filter(d => dowOf(d) === i).map(d => rec(d).mood)));
      out.push(xcard("Mood by weekday", "Average mood, out of 5.", barsHtml(mv, 5, DOW, mv.map((v, i) => `${DOW_NAME[i]}: ${v == null ? "no mood" : v.toFixed(1) + " of 5"}`))));
    }

    // 7. Goal streaks, across everything you've logged
    const keys = Object.keys(Store.all()).sort();
    const streaks = ok => {
      let best = 0, run = 0;
      if (keys.length) for (const d of daysFrom(keys[0], addDays(t, -1))) { if (ok(rec(d))) { run++; best = Math.max(best, run); } else run = 0; }
      if (ok(rec(t))) { run++; best = Math.max(best, run); }
      return { best, cur: run };
    };
    const s1 = streaks(r => r.steps != null && r.steps >= settings.stepGoal), s2 = streaks(r => sleepOf(r) != null && sleepOf(r) >= goalS);
    const last30 = daysFrom(addDays(t, -29), t);
    const tile = (v, l, sp) => `<div class="stat"><b>${v}</b><span>${l}</span>${sp || ""}</div>`;
    const streakHtml = s1.best || s2.best ? `<div class="stat-grid" style="margin-top:14px">
      ${tile(s1.cur, "days in a row over your step goal", X.spark(last30.map(d => dayVal(d, "steps"))))}
      ${tile(s1.best, "longest step-goal streak")}
      ${tile(s2.cur, `nights in a row with ${settings.sleepGoalH}h+`, X.spark(last30.map(d => sleepOf(rec(d)))))}
      ${tile(s2.best, "longest sleep-goal streak")}
    </div>` : "";

    if (!out.length && !streakHtml) return "";
    return `<section class="section"><h2>Trends and patterns</h2>${streakHtml}<div class="stack" style="margin-top:12px">${out.join("")}</div></section>`;
  }

  /* Numbers in stat tiles count up when a page opens. */
  function countUp(root) {
    if (reduced()) return;
    root.querySelectorAll(".stat b").forEach(el => {
      const txt = el.textContent, m = txt.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(\D*)$/);
      if (!m) return;
      const target = parseFloat(m[2].replace(/,/g, "")), dec = (m[2].split(".")[1] || "").length;
      if (!isFinite(target) || target === 0) return;
      const show = x => x.toLocaleString("en-GB", { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: m[2].includes(",") || target >= 1e4 });
      const t0 = performance.now(), dur = 900;
      const step = now => {
        if (!el.isConnected) return;
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = p < 1 ? m[1] + show(target * e) + m[3] : txt;
        if (p < 1) requestAnimationFrame(step);
      };
      el.textContent = m[1] + show(0) + m[3];
      requestAnimationFrame(step);
    });
  }

      if (vt.ready) vt.ready.catch(() => {});

    } else { change(); paint(); }
  }

    const h = document.documentElement, x = e && e.clientX ? e.clientX : innerWidth / 2, y = e && e.clientY ? e.clientY : innerHeight / 2;
    h.style.setProperty("--rx", x + "px"); h.style.setProperty("--ry", y + "px");
