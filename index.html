  function openSheet(html) { sheet.innerHTML = `<div class="sheet">${html}</div>`; if (!sheet.open) sheet.showModal(); }
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => { if (catchDirty) { catchDirty = false; paint(true); } });

  function healthSheet(d, pre) {
    const r = Store.getDay(d) || {}, v = x => x == null ? "" : x, t = today(), wakeV = (pre && pre.wake) || r.wakeAt || "";
    openSheet(`
      <div class="sheet-head"><h2>Body numbers</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      <div class="day-pick">
        <button type="button" class="icon-btn" data-act="health-shift" data-date="${addDays(d, -1)}" aria-label="Previous day">${ICON.left}</button>
        <label><span class="sr">Day</span><input class="inp" id="healthDate" type="date" max="${t}" value="${d}"></label>
        <button type="button" class="icon-btn" data-act="health-shift" data-date="${addDays(d, 1)}" aria-label="Next day" ${d >= t ? "disabled" : ""}>${ICON.right}</button>
      </div>
      <p class="sub" style="text-align:center">${esc(fmt(d, { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}${hasBody(r) ? "" : " · nothing logged yet"}</p>
      <form id="healthForm" data-date="${d}" style="margin-top:14px">
        <span class="label">Sleep · the night of ${esc(fmt(d, { weekday: "short", day: "numeric", month: "short" }))} into ${esc(fmt(addDays(d, 1), { weekday: "short" }))}</span>
        <div class="grid2">
          <label><span class="label">Went to bed</span><input class="inp" name="bed" type="time" value="${esc(r.bedAt || "")}"></label>
          <label><span class="label">Woke up</span><input class="inp" name="wake" type="time" value="${esc(wakeV)}"></label>
        </div>
        <div class="grid2" style="margin-top:10px">
          <input class="inp" name="sh" type="number" inputmode="numeric" min="0" max="24" placeholder="Hours" aria-label="Sleep hours" value="${r.sleepMin != null ? Math.floor(r.sleepMin / 60) : ""}">
          <input class="inp" name="sm" type="number" inputmode="numeric" min="0" max="59" placeholder="Minutes" aria-label="Sleep minutes" value="${r.sleepMin != null ? r.sleepMin % 60 : ""}">
        </div>
        <p class="note" id="sleepCalc" style="margin-top:6px">Times fill in the length. Change the hours if you know you slept less than you were in bed.</p>
        <div class="grid2" style="margin-top:14px">
          <label><span class="label">Steps</span><input class="inp" name="steps" type="number" inputmode="numeric" min="0" max="200000" value="${v(r.steps)}"></label>
          <label><span class="label">Stand (hours)</span><input class="inp" name="stand" type="number" inputmode="numeric" min="0" max="24" value="${v(r.standH)}"></label>
        </div>
        <label style="display:block;margin-top:14px"><span class="label">Walking + running distance (km)</span><input class="inp" name="km" type="number" inputmode="decimal" min="0" max="500" step="0.1" value="${v(r.distanceKm)}"></label>
        <span class="label" style="margin-top:16px">Workouts</span>
        <div class="wo-row" style="margin-top:0">
          ${(r.workouts || []).map((w, i) => `<button type="button" class="wo-chip" data-act="wo-edit" data-date="${d}" data-i="${i}">${woIcon(w.type)} ${esc(w.type)}${w.min ? ` · ${w.min} min` : ""}</button>`).join("")}
          <button type="button" class="wo-chip add" data-act="wo-add" data-date="${d}">+ Workout</button>
        </div>
        <button class="btn primary block" style="margin-top:20px">Save</button>
      </form>`);
  }

  function woSheet(d, i) {
    const list = (Store.getDay(d) || {}).workouts || [], w = i != null ? list[i] : null, v = x => x == null ? "" : x;
    const pick = w ? w.type : lastWoType();
    const opt = ([t, ic]) => `<label><input type="radio" name="type" value="${esc(t)}" ${pick === t ? "checked" : ""}><span>${ic} ${esc(t)}</span></label>`;
    const main = WO.filter(x => WO_MAIN.includes(x[0]) || x[0] === pick).sort((a, b) => (WO_MAIN.indexOf(a[0]) + 1 || 99) - (WO_MAIN.indexOf(b[0]) + 1 || 99));
    const more = WO.filter(x => !main.includes(x));
    openSheet(`
      <div class="sheet-head"><h2>${w ? "Edit workout" : "Log a workout"}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      <form id="woForm" data-date="${d}" data-i="${w ? i : ""}" style="margin-top:10px" autocomplete="off">
        <span class="label">Type</span>
        <div class="wo-pick">${main.map(opt).join("")}
          ${!WO.some(x => x[0] === pick) ? `<label><input type="radio" name="type" value="${esc(pick)}" checked><span>✨ ${esc(pick)}</span></label>` : ""}</div>
        <details class="wo-more"><summary>More types</summary><div class="wo-pick" style="margin-top:8px">${more.map(opt).join("")}</div></details>
        <div class="grid2" style="margin-top:14px">
          <label><span class="label">Date</span><input class="inp" name="date" type="date" max="${today()}" value="${d}" required></label>
          <label><span class="label">Started</span><input class="inp" name="start" type="time" value="${v(w && w.start)}"></label>
        </div>
        <div class="grid2" style="margin-top:14px">
          <label><span class="label">Minutes</span><input class="inp" name="min" type="number" inputmode="numeric" min="0" max="1440" value="${v(w && w.min)}" required></label>
          <label><span class="label">kcal (optional)</span><input class="inp" name="kcal" type="number" inputmode="numeric" min="0" max="10000" value="${v(w && w.kcal)}"></label>
        </div>
        <div class="wo-mins" role="group" aria-label="Quick minutes">${[30, 45, 60, 90].map(m => `<button type="button" class="chip" data-act="wo-min" data-v="${m}">${m} min</button>`).join("")}</div>
        <div class="grid2" style="margin-top:14px">
          <label><span class="label">Distance in km (optional)</span><input class="inp" name="km" type="number" inputmode="decimal" min="0" max="500" step="0.01" value="${v(w && w.km)}"></label>
          <label id="woPace" ${PACED.includes(pick) ? "" : "hidden"}><span class="label">Pace (min/km)</span><input class="inp" name="pace" type="text" inputmode="decimal" placeholder="5:30" value="${fmtPace(paceOf(w))}"></label>
        </div>
        <p class="note" id="woPaceNote" style="margin-top:6px" ${PACED.includes(pick) ? "" : "hidden"}>Enter any two of minutes, distance and pace, and Tracker fills in the third.</p>
        <div class="grid2" style="margin-top:20px">
          ${w ? `<button type="button" class="btn danger" data-act="wo-del" data-date="${d}" data-i="${i}">Delete</button>` : `<button type="button" class="btn" data-act="close">Cancel</button>`}
          <button class="btn primary">Save</button>
        </div>
      </form>`);
  }

  function settingsSheet() {
    const seg = ["auto", "day", "night"].map(t => `<button type="button" class="${settings.theme === t ? "on" : ""}" data-act="theme" data-theme-opt="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
    const looks = STYLES.map(([k, n, d, c]) => `<button type="button" class="look ${settings.style === k ? "on" : ""}" data-act="look" data-look="${k}" aria-pressed="${settings.style === k}">
        <span class="look-sw" aria-hidden="true">${c.map(x => `<i style="background:${x}"></i>`).join("")}</span><b>${n}</b><small>${d}</small></button>`).join("");
    openSheet(`
      <div class="sheet-head"><h2>Settings</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      <h3>Look</h3>
      <div class="looks" role="group" aria-label="Look">${looks}</div>
      <div class="row" style="margin-top:16px"><span>Mode</span><div class="seg">${seg}</div></div>
      <h3>Daily reminder</h3>
      <div class="row">
        <span>Remind me to write</span>
        <label class="switch"><input type="checkbox" id="remindOn" ${settings.remindOn ? "checked" : ""} aria-label="Daily reminder"><span></span></label>
      </div>
      <div class="row" style="margin-top:12px"><span>At</span><input class="inp" id="remindAt" type="time" value="${esc(settings.remindAt)}" style="width:140px"></div>
      <p class="note">For now this only works while Tracker is open in this browser. Reminders on your iPhone come when the app goes online.</p>
      <h3>Goals</h3>
      <div class="grid2">
        <label><span class="label">Sleep (hours)</span><input class="inp" id="sleepGoal" type="number" inputmode="decimal" min="3" max="14" step="0.5" value="${settings.sleepGoalH}"></label>
        <label><span class="label">Steps</span><input class="inp" id="stepGoal" type="number" inputmode="numeric" min="1000" max="50000" step="500" value="${settings.stepGoal}"></label>
      </div>
      ${EXTRA.settings.map(f => f()).join("")}
      <h3>Backup</h3>
      <div class="grid2">
        <button class="btn" data-act="export">Export</button>
        <button class="btn" data-act="import">Import</button>
      </div>
      <p class="note">A file with everything on this device, for safekeeping.</p>
      <h3>Danger</h3>
      <button class="btn danger block" data-act="wipe">Delete everything</button>`);
  }

  /* ================= backup ================= */
  function exportData() {
    const blob = new Blob([JSON.stringify(Object.assign({ app: "tracker", version: 2, exportedAt: new Date().toISOString(), days: Store.all(), ideas: Ideas.get() }, ...HOOKS.exportParts.map(f => f())), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `tracker-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Backup downloaded");
  }
  function cleanImport(data) {
    const src = data && typeof data.days === "object" && data.days ? data.days : null;
    if (!src) return null;
    const out = {}, num = (v, max) => (typeof v === "number" && isFinite(v) && v >= 0 && v <= max) ? v : undefined;
    for (const k of Object.keys(src)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !src[k] || typeof src[k] !== "object") continue;
      const r = src[k], rec = { date: k };
      if (typeof r.line === "string" && r.line.trim()) rec.line = r.line.slice(0, 280);
      if (typeof r.newThing === "string" && r.newThing.trim()) rec.newThing = r.newThing.slice(0, 140);
      if ([1, 2, 3, 4, 5].includes(r.mood)) rec.mood = r.mood;
      const h = { sleepMin: num(r.sleepMin, 1440), steps: num(r.steps, 200000), exerciseMin: num(r.exerciseMin, 1440), distanceKm: num(r.distanceKm, 500), activeKcal: num(r.activeKcal, 20000), standH: num(r.standH, 24) };
      HEALTH.forEach(x => { if (h[x] !== undefined) rec[x] = h[x]; });
      TIMES.forEach(x => { if (isClock(r[x])) rec[x] = r[x]; });
      const wo = cleanWorkouts(r.workouts); if (wo) rec.workouts = wo;
      rec.updatedAt = typeof r.updatedAt === "string" ? r.updatedAt : new Date().toISOString();
      if (!isBlank(rec)) out[k] = rec;
    }
    return out;
  }
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    let days = null;
    let raw = null;
    try { raw = JSON.parse(await f.text()); days = cleanImport(raw); } catch (err) {}
    if (!days) return toast("That file isn't a Tracker backup.");
    const n = Object.keys(days).length;
    if (!Store.merge(days)) return toast("Couldn't save the imported days.");
    Ideas.merge(raw.ideas);
    HOOKS.importParts.forEach(f => { try { f(raw); } catch (err) {} });
    if (sheet.open) sheet.close();
    paint(); toast(`Imported ${n} day${n === 1 ? "" : "s"}`);
  });

  /* ================= reminder ================= */
  function checkReminder() {
    if (!settings.remindOn) return;
    const now = new Date(), t = today(), [h, m] = (settings.remindAt || "21:00").split(":").map(Number);
    if (now.getHours() * 60 + now.getMinutes() < h * 60 + m) return;
    if (hasLine(Store.getDay(t)) || LS.get("stillday.reminded") === t) return;
    LS.set("stillday.reminded", t);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Tracker", { body: "Don't forget today's line.", icon: "icon-192.png" }); } catch (e) {}
    }
    toast("Don't forget today's line.");
  }
  setInterval(() => { checkReminder(); tickDay(); }, 30000);

  /* ================= events ================= */
  let wipeArmed = false;
  document.addEventListener("click", e => {
    const sub = e.target.closest("[data-sub]");
    if (sub) { if (sub.dataset.sub !== S.tab) go(() => { S.tab = sub.dataset.sub; }); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      const g = tab.dataset.tab, target = g === "journal" ? S.lastJournal : NAV[g][0];
      if (groupOf(S.tab) !== g) go(() => { S.tab = target; }); else window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
      return;
    }
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act;
    if (act !== "wipe") wipeArmed = false;
    if (EXTRA.actions[act]) { EXTRA.actions[act](el, e); return; }
    switch (act) {
      case "prev": go(() => { S.date = addDays(S.date, -1); }, "prev"); break;
      case "next": if (S.date < today()) go(() => { S.date = addDays(S.date, 1); }, "next"); break;
      case "goto-today": go(() => { S.date = today(); }, "next"); break;
      case "open-day": if (el.dataset.date <= today()) go(() => { S.date = el.dataset.date; S.tab = "today"; }); break;
      case "mood": {
        const n = Number(el.dataset.mood), cur = (Store.getDay(S.date) || {}).mood;
        flush();
        showSaved(Store.saveDay(S.date, { mood: cur === n ? null : n }));
        document.querySelectorAll("#moods .mood").forEach(b => { const on = Number(b.dataset.mood) === n && cur !== n; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        break;
      }
      case "year-prev": go(() => { S.year--; }); break;
      case "year-next": if (S.year < new Date().getFullYear()) go(() => { S.year++; }); break;
      case "range": if (S.range !== el.dataset.range) go(() => { S.range = el.dataset.range; S.off = 0; }); break;
      case "dow": go(() => { const i = Number(el.dataset.dow); S.dows = S.dows.includes(i) ? S.dows.filter(x => x !== i) : S.dows.concat(i); }); break;
      case "dow-set": go(() => { const s = el.dataset.set; const next = s ? s.split("").map(Number) : []; S.dows = JSON.stringify(next) === JSON.stringify(S.dows) ? [] : next; }); break;
      case "body-prev": go(() => { S.off++; }, "prev"); break;
      case "body-next": if (S.off > 0) go(() => { S.off--; }, "next"); break;
      case "health": flush(); healthSheet(S.date); break;
      case "health-today": healthSheet(today()); break;
      case "health-day": if (el.dataset.date <= today()) healthSheet(el.dataset.date); break;
      case "health-shift": if (el.dataset.date <= today()) healthSheet(el.dataset.date); break;
      case "sleep-bed": {
        const p = Sleep.bed(new Date()); paint(true);
        toast(p.prevMin ? `Back to bed. Still counting from ${p.firstBed}.` : `Good night. In bed at ${p.firstBed}.`); break;
      }
      case "sleep-wake": {
        const now = new Date();
        // No Going to bed tap last night: ask for the bedtime instead of guessing.
        if (!Sleep.pending()) { healthSheet(nightOfWake(now), { wake: hhmm(now) }); const b = $('#healthForm [name="bed"]'); if (b && !b.value) b.focus(); break; }
        const x = Sleep.wake(now); paint(true);
        toast(x.min ? `Slept ${fmtSleep(x.min)} · ${x.bed} to ${x.wake}` : `Up at ${x.wake}`); break;
      }
      case "sleep-cancel": Sleep.cancel(); paint(true); toast("Bedtime cleared"); break;
      case "wo-add": flush(); woSheet(el.dataset.date || today(), null); break;
      case "wo-min": { const inp = $("#woForm [name=min]"); if (inp) { inp.value = el.dataset.v; inp.dispatchEvent(new Event("input", { bubbles: true })); inp.focus(); } break; }
      case "wo-edit": flush(); woSheet(el.dataset.date, Number(el.dataset.i)); break;
      case "wo-del": {
        if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Tap again to delete"; break; }
        const list = ((Store.getDay(el.dataset.date) || {}).workouts || []).slice();
        list.splice(Number(el.dataset.i), 1);
        Store.saveDay(el.dataset.date, { workouts: list }); sheet.close(); paint(true); toast("Workout deleted"); break;
      }
      case "catchup": catchupSheet(addDays(today(), -30), addDays(today(), -1)); break;
      case "catchup-year": { const t = today(), end = `${S.year}-12-31` < t ? `${S.year}-12-31` : addDays(t, -1); catchupSheet(`${S.year}-01-01`, end, `Empty days in ${S.year}`); break; }
      case "catch-mood": {
        const d = el.dataset.date, n = Number(el.dataset.mood), cur = (Store.getDay(d) || {}).mood;
        Store.saveDay(d, { mood: cur === n ? null : n }); catchDirty = true;
        el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.mood) === n && cur !== n));
        break;
      }
      case "settings": settingsSheet(); break;
      case "close": sheet.close(); break;
      case "theme": settings.theme = el.dataset.themeOpt; saveSettings(); reveal(e, () => { applyTheme(); settingsSheet(); }); break;
      case "look": settings.style = el.dataset.look; saveSettings(); reveal(e, () => { applyTheme(); settingsSheet(); paint(true); }); break;
      case "idea": Ideas.toggle(el.dataset.id); paint(true); break;
      case "idea-topic": S.ideaTopic = el.dataset.t; paint(true); break;
      case "mine-done": Ideas.done(el.dataset.id); paint(true); break;
      case "mine-del": Ideas.del(el.dataset.id); paint(true); break;
      case "export": exportData(); break;
      case "import": $("#importFile").click(); break;
      case "wipe":
        if (!wipeArmed) { wipeArmed = true; el.textContent = "Tap again to delete every day"; break; }
        wipeArmed = false; Store.clear(); Ideas.clear(); HOOKS.wipe.forEach(f => f()); sheet.close(); paint(); toast("Everything deleted"); break;
    }
  });
  document.addEventListener("submit", e => {
    const extraSubmit = EXTRA.submits[e.target.id];
    if (extraSubmit) { e.preventDefault(); extraSubmit(e.target); return; }
    if (e.target.id === "ideaForm") {
      e.preventDefault();
      const txt = $("#ideaInput").value.trim();
      if (!txt) return;
      const tsel = $("#ideaTopic");
      Ideas.add(txt.slice(0, 140), tsel ? tsel.value : "Mine"); paint(true);
      const again = $("#ideaInput"); if (again) again.focus();
      return;
    }
    if (e.target.id === "woForm") {
      e.preventDefault();
      const f = new FormData(e.target), g = k => String(f.get(k) || "").trim(), num = k => { const v = g(k); return v === "" || !isFinite(Number(v)) || Number(v) < 0 ? undefined : Number(v); };
      const date = g("date"), oldDate = e.target.dataset.date, oldI = e.target.dataset.i;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > today()) return toast("Pick a day up to today.");
      const w = cleanWorkouts([{ type: g("type"), min: num("min"), kcal: num("kcal"), km: num("km"), start: g("start") }]);
      if (!w) return toast("Add the minutes (or kcal or distance).");
      if (oldI !== "") { const ol = ((Store.getDay(oldDate) || {}).workouts || []).slice(); ol.splice(Number(oldI), 1); if (oldDate !== date) Store.saveDay(oldDate, { workouts: ol }); else { ol.splice(Number(oldI), 0, w[0]); Store.saveDay(date, { workouts: ol }); } }
      if (oldI === "" || oldDate !== date) Store.saveDay(date, { workouts: ((Store.getDay(date) || {}).workouts || []).concat(w).sort((a, b) => (a.start || "99") < (b.start || "99") ? -1 : 1) });
      sheet.close(); paint(true); toast("Workout saved");
      return;
    }
    if (e.target.id !== "healthForm") return;
    e.preventDefault();
    const f = new FormData(e.target), n = k => { const v = String(f.get(k) || "").trim(); return v === "" || !isFinite(Number(v)) || Number(v) < 0 ? null : Number(v); };
    const sh = n("sh"), sm = n("sm"), clock = k => { const v = String(f.get(k) || "").trim().slice(0, 5); return isClock(v) ? v : null; };
    const bedAt = clock("bed"), wakeAt = clock("wake"), fromTimes = bedAt && wakeAt ? nightLen(bedAt, wakeAt) : null;
    const ok = Store.saveHealth(e.target.dataset.date, {
      bedAt, wakeAt,
      sleepMin: sh == null && sm == null ? fromTimes : Math.min(1440, Math.round((sh || 0) * 60 + (sm || 0))),
      steps: n("steps") == null ? null : Math.round(n("steps")),
      standH: n("stand") == null ? null : Math.min(24, Math.round(n("stand"))),
      distanceKm: n("km")
    });
    sheet.close(); paint(true);
    toast(ok ? `Saved for ${fmt(e.target.dataset.date, { day: "numeric", month: "short" })}` : "Couldn't save. Is browser storage blocked or full?");
  });
  // Typing a bedtime and wake-up fills in the hours and minutes.
  document.addEventListener("input", e => {
    const form = e.target.form;
    if (!form || form.id !== "healthForm" || !["bed", "wake"].includes(e.target.name)) return;
    const b = form.elements.bed.value.slice(0, 5), w = form.elements.wake.value.slice(0, 5), len = isClock(b) && isClock(w) ? nightLen(b, w) : null;
    if (!len) return;
    form.elements.sh.value = Math.floor(len / 60); form.elements.sm.value = len % 60;
    const note = $("#sleepCalc"); if (note) note.textContent = `${fmtSleep(len)} in bed. Lower it if you lay awake for a while.`;
  });
  // Running: any two of minutes, distance and pace fill in the third.
  document.addEventListener("input", e => {
    const form = e.target.form;
    if (!form || form.id !== "woForm") return;
    const el = form.elements, n = k => { const x = Number(el[k].value); return el[k].value !== "" && x > 0 ? x : null; };
    if (e.target.name === "type") {
      const on = PACED.includes(e.target.value);
      ["#woPace", "#woPaceNote"].forEach(s => { const x = $(s); if (x) x.hidden = !on; });
      return;
    }
    if (!PACED.includes(String(new FormData(form).get("type")))) return;
    const min = n("min"), km = n("km"), p = parsePace(el.pace.value);
    if (e.target.name === "pace") {
      if (!p) return;
      if (min) el.km.value = Math.round(min / p * 100) / 100;
      else if (km) el.min.value = Math.round(km * p);
    } else if (e.target.name === "min" || e.target.name === "km") {
      const other = e.target.name === "min" ? km : min;
      if (min && km) el.pace.value = fmtPace(min / km);
      else if (!other && p && e.target.name === "min" && min) el.km.value = Math.round(min / p * 100) / 100;
      else if (!other && p && e.target.name === "km" && km) el.min.value = Math.round(km * p);
    }
  });
  document.addEventListener("change", async e => {
    const extraChange = EXTRA.changes[e.target.id];
    if (extraChange) extraChange(e.target);
    if (e.target.id === "rangeFrom" || e.target.id === "rangeTo") {
      const v = e.target.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) go(() => {
        if (e.target.id === "rangeFrom") { S.from = v; if (S.to && S.to < v) S.to = v; } else { S.to = v; if (S.from && S.from > v) S.from = v; }
      });
    }
    if (e.target.id === "healthDate") { const v = e.target.value; if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v <= today()) healthSheet(v); }
    if (e.target.dataset && e.target.dataset.catch) saveCatch(e.target);
    if (e.target.id === "sleepGoal") { const v = Number(e.target.value); if (isFinite(v) && v >= 3 && v <= 14) { settings.sleepGoalH = v; saveSettings(); } }
    if (e.target.id === "stepGoal") { const v = Math.round(Number(e.target.value)); if (isFinite(v) && v >= 1000 && v <= 50000) { settings.stepGoal = v; saveSettings(); } }
    if (e.target.id === "remindAt") { settings.remindAt = e.target.value || "21:00"; saveSettings(); LS.del("stillday.reminded"); }
    if (e.target.id === "remindOn") {
      settings.remindOn = e.target.checked; saveSettings();
      if (settings.remindOn && "Notification" in window && Notification.permission === "default") {
        try { await Notification.requestPermission(); } catch (err) {}
      }
      if (settings.remindOn) toast(`Reminder set for ${settings.remindAt}`);
    }
  });
  document.addEventListener("keydown", e => {
    if (e.target.id === "line" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const nt = $("#newThing"); if (nt) nt.focus(); return; }
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.catch) {
      e.preventDefault(); saveCatch(e.target);
      const all = [...document.querySelectorAll("#sheet [data-catch]")], next = all.slice(all.indexOf(e.target) + 1).find(x => !x.value.trim());
      if (next) next.focus(); else e.target.blur();
      return;
    }
    // Arrow keys move between days on Today, T jumps back to today (not while typing).
    if (S.tab !== "today" || sheet.open || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest("input, textarea, select"))) return;
    if (e.key === "ArrowLeft") go(() => { S.date = addDays(S.date, -1); }, "prev");
    else if (e.key === "ArrowRight" && S.date < today()) go(() => { S.date = addDays(S.date, 1); }, "next");
    else if ((e.key === "t" || e.key === "T") && S.date !== today()) go(() => { S.date = today(); }, "next");
  });
  /* Swipe left or right on Today to change day. */
  let swipe = null;
  document.addEventListener("touchstart", e => {
    swipe = null;
    if (S.tab !== "today" || e.touches.length !== 1 || !e.target.closest("#view") || e.target.closest("textarea, input, .moods")) return;
    swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!swipe) return;
    const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y; swipe = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .5) return;
    if (dx > 0) go(() => { S.date = addDays(S.date, -1); }, "prev");
    else if (S.date < today()) go(() => { S.date = addDays(S.date, 1); }, "next");
  }, { passive: true });
  /* Cards catch a soft light under the mouse. */
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const c = e.target.closest && e.target.closest(".card, .tile, .stat"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });
  window.addEventListener("resize", moveInd);

  /* ================= modules & start ================= */
  window.Stillday = {
    $, esc, pad, ymd, parse, today, addDays, addMonths, fmt, fmtNum, fmtSleep, dayOfYear, daysInYear, LS, toast, openSheet,
    closeSheet: () => { if (sheet.open) sheet.close(); }, paint, ICON, barsHtml, avgOf, Store, Ideas, settings, saveSettings,
    settingsSheet, cleanDays: cleanImport, ILLO, HOOKS, EXTRA, VIEWS, changed, hasLine,
    clockMin, eveMin, fromEve, nightLen, MOODS, woType, woIcon, daysFrom
  };

  function start() {
    renderNav();
    applyTheme();
    paint();
    requestAnimationFrame(() => requestAnimationFrame(() => $("#tabs").classList.add("ready")));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
    checkReminder();
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }
  // The module scripts load after this one and register their views first.
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>

<script src="flights.js"></script>
<script src="insights.js"></script>
