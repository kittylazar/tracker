      <h2>On this day</h2>
      <div class="stack" style="margin-top:14px">
        ${looks.map(([d, l]) => { const r = Store.getDay(d); return `
          <button class="card" data-act="open-day" data-date="${d}">
            <div class="eyebrow">${l} · ${esc(fmt(d, { day: "numeric", month: "short", year: "numeric" }))}</div>
            ${hasLine(r) ? `<p class="quote">${esc(r.line)}</p>` : `<p class="quote none">Nothing written for this day yet.</p>`}
          </button>`; }).join("")}
      </div>
    </section>
    ${news.length ? `<section class="section">
      <h2>New this month</h2>
      <div class="stack" style="margin-top:14px">
        ${news.slice().reverse().map(r => `<button class="card" data-act="open-day" data-date="${r.date}">
          <div class="eyebrow">${esc(fmt(r.date, { weekday: "short", day: "numeric", month: "short" }))}</div>
          <p class="quote">${esc(r.newThing)}</p></button>`).join("")}
      </div>
    </section>` : ""}`;
  }

  function avgOf(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }

  function barsHtml(vals, max, labels, titles, cls) {
    let top = -1;
    vals.forEach((v, i) => { if (v != null && v > 0 && (top < 0 || v > vals[top])) top = i; });
    const n = vals.length, cols = `grid-template-columns:repeat(${n},minmax(0,1fr));gap:${n > 16 ? 2 : n > 8 ? 4 : 8}px`;
    return `<div class="wk ${cls || ""}" style="${cols}">${vals.map((v, i) => `<div><div class="bar"><i class="${i === top ? "peak" : ""}" title="${esc(titles[i])}" style="height:${v ? Math.max(4, v / max * 100) : 0}%;animation-delay:${i * 30}ms"></i></div><span>${labels[i]}</span></div>`).join("")}</div>`;
  }

  function yearStats(y) {
    const recs = Store.listRange(`${y}-01-01`, `${y}-12-31`), kept = recs.filter(hasLine);
    if (!kept.length) return "";
    const thisYear = new Date().getFullYear(), t = today();
    const possible = y < thisYear ? daysInYear(y) : dayOfYear(t);
    const words = kept.reduce((n, r) => n + r.line.trim().split(/\s+/).length, 0);
    const newN = recs.filter(r => (r.newThing || "").trim()).length;
    const mAvg = avgOf(recs.filter(r => r.mood).map(r => r.mood));
    let best = 0, run = 0, prev = null;
    kept.forEach(r => { run = prev && addDays(prev, 1) === r.date ? run + 1 : 1; best = Math.max(best, run); prev = r.date; });
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;

    const WD = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const wd = Array.from({ length: 7 }, () => ({ n: 0, ms: 0, mn: 0 }));
    kept.forEach(r => { const i = (parse(r.date).getDay() + 6) % 7; wd[i].n++; if (r.mood) { wd[i].ms += r.mood; wd[i].mn++; } });
    const maxN = Math.max(...wd.map(w => w.n)), topDay = wd.findIndex(w => w.n === maxN);
    let bright = -1, bestM = 0;
    wd.forEach((w, i) => { if (w.mn >= 2 && w.ms / w.mn > bestM) { bestM = w.ms / w.mn; bright = i; } });

    const MN = Array.from({ length: 12 }, (_, m) => new Date(y, m, 1).toLocaleDateString("en-GB", { month: "long" }));
    const perMonth = MN.map((_, m) => kept.filter(r => r.date.startsWith(`${y}-${pad(m + 1)}-`)).length);
    const moodMonth = MN.map((_, m) => avgOf(recs.filter(r => r.mood && r.date.startsWith(`${y}-${pad(m + 1)}-`)).map(r => r.mood)));
    const anyMood = moodMonth.some(v => v != null);

    return `
    <section class="section">
      <h2>${y} in numbers</h2>
      <div class="stat-grid" style="margin-top:14px">
        ${st(kept.length, "days kept")}
        ${st(best, "longest streak")}
        ${st(`${Math.round(kept.length / possible * 100)}%`, "of days kept")}
        ${st(mAvg == null ? "–" : mAvg.toFixed(1), "average mood, of 5")}
        ${st(fmtNum(words), "words written")}
        ${st(newN, "new things")}
      </div>
    </section>
    <section class="section">
      <div class="card">
        <span class="label" style="margin:0">Lines by weekday</span>
        <div class="sub" style="margin-top:2px">Most lines on ${WD[topDay]}s${bright >= 0 ? `, brightest mood on ${WD[bright]}s` : ""}.</div>
        ${barsHtml(wd.map(w => w.n), maxN, ["M", "T", "W", "T", "F", "S", "S"], wd.map((w, i) => `${WD[i]}: ${w.n} lines`))}
      </div>
    </section>
    <section class="section">
      <div class="card">
        <span class="label" style="margin:0">Lines per month</span>
        ${barsHtml(perMonth, Math.max(...perMonth, 1), "JFMAMJJASOND".split(""), perMonth.map((n, i) => `${MN[i]}: ${n} lines`), "m12")}
      </div>
    </section>
    ${anyMood ? `<section class="section">
      <div class="card">
        <span class="label" style="margin:0">Average mood by month</span>
        ${barsHtml(moodMonth, 5, "JFMAMJJASOND".split(""), moodMonth.map((v, i) => `${MN[i]}: ${v == null ? "no mood" : v.toFixed(1) + " of 5"}`), "m12")}
      </div>
    </section>` : ""}`;
  }

  function viewYear() {
    const y = S.year, t = today(), thisYear = new Date().getFullYear();
    const recs = Store.listRange(`${y}-01-01`, `${y}-12-31`).filter(hasLine);
    const possible = y < thisYear ? daysInYear(y) : y === thisYear ? dayOfYear(t) : 0;
    const start = firstLine();
    const yEnd = `${y}-12-31` < t ? `${y}-12-31` : addDays(t, -1);
    const missN = missingDays(`${y}-01-01`, yEnd).length;
    const months = Array.from({ length: 12 }, (_, m) => {
      const first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate(), offset = (first.getDay() + 6) % 7;
      let cells = "<span></span>".repeat(offset);
      for (let d = 1; d <= n; d++) {
        const key = `${y}-${pad(m + 1)}-${pad(d)}`, r = Store.getDay(key), has = hasLine(r);
        const cls = key > t ? "future" : has ? "has" : (start && key >= start && key < t) ? "miss" : "";
        const o = has ? (r.mood ? (0.2 + r.mood * 0.16).toFixed(2) : "0.6") : "";
        cells += `<button class="dot ${cls} ${key === t ? "now" : ""}" data-act="open-day" data-date="${key}" ${o ? `style="--o:${o}"` : ""} ${key > t ? "disabled" : ""} aria-label="${esc(fmt(key, { day: "numeric", month: "long" }))}${has ? ", written" : ""}" title="${has ? esc(r.line) : ""}"></button>`;
      }
      return `<div><div class="month-name">${first.toLocaleDateString("en-GB", { month: "long" })}</div><div class="dots" style="--m:${m}">${cells}</div></div>`;
    }).join("");
    return `
    <section class="year-head">
      <div>
        <div class="eyebrow">Every day is a dot</div>
        <h1 style="margin-top:8px">${y}</h1>
      </div>
      <div>
        <button class="icon-btn" data-act="year-prev" aria-label="Previous year" style="display:inline-grid">${ICON.left}</button>
        <button class="icon-btn" data-act="year-next" aria-label="Next year" style="display:inline-grid" ${y >= thisYear ? "disabled" : ""}>${ICON.right}</button>
      </div>
    </section>
    <p class="sub" style="margin-top:12px">${recs.length} of ${possible} days kept${y === thisYear ? ` · ${daysInYear(y) - dayOfYear(t)} still to come` : ""}. Brighter dots were brighter days${missN ? ", outlined dots are still empty" : ""}.</p>
    ${missN ? `<div class="hero-meta"><button class="chip accent" data-act="catchup-year">Fill ${missN} empty day${missN === 1 ? "" : "s"}</button></div>` : ""}
    <section class="months">${months}</section>
    ${yearStats(y)}`;
  }

  /* ================= body ================= */
  const RANGES = [["3d", "3 days", 3], ["week", "Week", 7], ["2w", "2 weeks", 14], ["month", "Month", 30], ["quarter", "3 months", 91], ["6m", "6 months", 182], ["year", "Year", 365], ["all", "All", 0], ["custom", "Custom", 0]];
  const DOW = ["M", "T", "W", "T", "F", "S", "S"], DOW_NAME = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const dowOf = d => (parse(d).getDay() + 6) % 7; // Monday = 0
  const dowOk = d => !S.dows.length || S.dows.includes(dowOf(d));
  const dowLabel = () => {
    const s = S.dows.slice().sort((a, b) => a - b).join("");
    return !s ? "" : s === "01234" ? "weekdays" : s === "56" ? "weekends" : S.dows.slice().sort((a, b) => a - b).map(i => DOW_NAME[i]).join(", ");
  };
  const span = (a, b) => Math.round((parse(b) - parse(a)) / 864e5) + 1;
  const daysFrom = (from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; };

  // The window of days the Body page shows, and how to group them into bars.
  function bodyWindow() {
    const t = today(), r = RANGES.find(x => x[0] === S.range) || RANGES[0];
    let from, to = t;
    if (r[0] === "all") {
      const ks = Object.keys(Store.all()).filter(k => hasBody(Store.getDay(k))).sort();
      from = ks[0] && ks[0] < addDays(t, -29) ? ks[0] : addDays(t, -29);
    } else if (r[0] === "custom") {
      to = S.to && S.to <= t ? S.to : t;
      from = S.from && S.from <= to ? S.from : addDays(to, -29);
    } else { to = addDays(t, -S.off * r[2]); from = addDays(to, -(r[2] - 1)); }
    let days = daysFrom(from, to);
    const n = days.length; // size of the window before the weekday filter
    let dowIgnored = false;
    if (S.dows.length) { const f = days.filter(dowOk); if (f.length) days = f; else dowIgnored = true; }
    let buckets;
    const group = keyOf => { const m = new Map(); days.forEach(d => { const k = keyOf(d); if (!m.has(k)) m.set(k, []); m.get(k).push(d); }); return [...m].map(([k, ds]) => ({ key: k, days: ds })); };
    if (n <= 31) buckets = days.map(d => ({ key: d, days: [d] }));
    else if (n <= 120) buckets = group(d => addDays(from, Math.floor((span(from, d) - 1) / 7) * 7));
    else if (n <= 1500) buckets = group(d => d.slice(0, 7));
    else buckets = group(d => d.slice(0, 4));
    const unit = n <= 31 ? "day" : n <= 120 ? "week" : n <= 1500 ? "month" : "year";
    return { from, to, days, n: days.length, raw: n, buckets, unit, kind: r[0], len: r[2], dowIgnored };
  }
  const bucketLabel = (b, unit) => unit === "day" ? fmt(b.key, { day: "numeric", month: "short" })
    : unit === "week" ? `Week of ${fmt(b.key, { day: "numeric", month: "short" })}`
    : unit === "month" ? fmt(b.key + "-01", { month: "short", year: "numeric" }) : b.key;
  const dayVal = (d, key) => { const r = Store.getDay(d); return r && r[key] != null ? Number(r[key]) : null; };

  function chart(W, key, show) {
    const vals = W.buckets.map(b => avgOf(b.days.map(d => dayVal(d, key)).filter(v => v != null)));
    const have = W.days.map(d => dayVal(d, key)).filter(v => v != null);
    const max = Math.max(1, ...vals.filter(v => v != null)), n = vals.length, VW = 300, H = 80, bw = VW / n, gap = n > 40 ? 1 : n > 10 ? 2 : 6;
    const bars = vals.map((v, i) => {
      const h = v == null ? 2 : Math.max(3, (v / max) * H), b = W.buckets[i], one = b.days.length === 1;
      const tip = `${bucketLabel(b, W.unit)}: ${v == null ? (one ? "no data, tap to add" : "no data") : (one ? "" : "average ") + show(v)}`;
      return `<rect class="${v == null ? "empty" : ""} ${one ? "tap" : ""}" ${one ? `data-act="health-day" data-date="${b.key}"` : ""} x="${(i * bw + gap / 2).toFixed(2)}" y="${(H - h).toFixed(1)}" width="${Math.max(.5, bw - gap).toFixed(2)}" height="${h.toFixed(1)}" rx="${Math.min(4, (bw - gap) / 2).toFixed(1)}" style="animation-delay:${Math.min(i, 60) * 10}ms"><title>${esc(tip)}</title></rect>`;
    }).join("");
    return { avg: avgOf(have), count: have.length, svg: `<svg viewBox="0 0 ${VW} ${H}" preserveAspectRatio="none" role="img">${bars}</svg>` };
  }

  function bodyStats(W) {
    const rows = W.days.map(d => Store.getDay(d)).filter(Boolean);
    if (!rows.some(hasBody)) return "";
    const sum = k => rows.reduce((n, r) => n + (r[k] || 0), 0);
    const best = k => rows.filter(r => r[k] != null).reduce((b, r) => !b || r[k] > b[k] ? r : b, null);
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const bs = best("steps"), bl = best("sleepMin");
    const nSteps = rows.filter(r => r.steps != null).length, hit = rows.filter(r => r.steps != null && r.steps >= settings.stepGoal).length;
    const nSleep = rows.filter(r => r.sleepMin != null).length, slept = rows.filter(r => r.sleepMin != null && r.sleepMin >= settings.sleepGoalH * 60).length;
    const dd = r => esc(fmt(r.date, { day: "numeric", month: "short" }));
    return `<section class="section"><h2>Highlights</h2><div class="stat-grid" style="margin-top:14px">
      ${st(fmtNum(sum("steps")), "steps in total")}
      ${st(`${(Math.round(sum("distanceKm") * 10) / 10).toLocaleString("en-GB")} km`, "distance in total")}
      ${st(`${fmtNum(sum("exerciseMin"))} min`, "movement in total")}
      ${st(bs ? fmtNum(bs.steps) : "–", bs ? `most steps · ${dd(bs)}` : "most steps")}
      ${st(bl ? fmtSleep(bl.sleepMin) : "–", bl ? `longest sleep · ${dd(bl)}` : "longest sleep")}
      ${st(nSteps ? `${hit}/${nSteps}` : "–", `days over ${fmtNum(settings.stepGoal)} steps`)}
      ${nSleep ? st(`${slept}/${nSleep}`, `nights with ${settings.sleepGoalH}h+ sleep`) : ""}
      ${sum("activeKcal") ? st(fmtNum(sum("activeKcal")), "active kcal burned") : ""}
      ${nSleep ? st(fmtSleep(Math.round(sum("sleepMin") / nSleep)), "average night") : ""}
    </div></section>`;
  }

  function compareMood(key, goal, label) {
    const rows = Object.values(Store.all()).filter(r => r.mood && r[key] != null);
    const hi = rows.filter(r => r[key] >= goal), lo = rows.filter(r => r[key] < goal);
    if (hi.length < 3 || lo.length < 3) return null;
    return `On days with ${label}, mood averaged <b>${avgOf(hi.map(r => r.mood)).toFixed(1)}</b> versus <b>${avgOf(lo.map(r => r.mood)).toFixed(1)}</b> on other days <span class="sub">(${hi.length} and ${lo.length} days)</span>.`;
  }

  function bodyInsights() {
    const t = today(), items = [];
    const a = compareMood("sleepMin", settings.sleepGoalH * 60, `${settings.sleepGoalH}h+ of sleep`);
    const b = compareMood("steps", settings.stepGoal, `${fmtNum(settings.stepGoal)}+ steps`);
    if (a) items.push(a);
    if (b) items.push(b);
    const wRows = Object.values(Store.all()).filter(r => r.mood);
    const withW = wRows.filter(r => r.workouts && r.workouts.length), noW = wRows.filter(r => !(r.workouts && r.workouts.length));
    if (withW.length >= 3 && noW.length >= 3) items.push(`On days you worked out, mood averaged <b>${avgOf(withW.map(r => r.mood)).toFixed(1)}</b> versus <b>${avgOf(noW.map(r => r.mood)).toFixed(1)}</b> on rest days.`);
    const sl = Store.listRange(addDays(t, -29), t).filter(r => r.sleepMin != null).map(r => r.sleepMin);
    if (sl.length >= 5) {
      const m = avgOf(sl), sd = Math.sqrt(avgOf(sl.map(x => (x - m) ** 2)));
      items.push(`Over the last 30 days your sleep length varied by about <b>${Math.round(sd)} minutes</b> from night to night.`);
    }
    return `<section class="section"><h2>What your numbers say</h2>
      ${items.length ? items.map(i => `<p class="insight">${i}</p>`).join("") : `<p class="sub" style="margin-top:8px">Log mood plus sleep, steps or workouts on at least 3 days either way to see patterns.</p>`}
      <p class="note">These are patterns in your own days, not proof of cause. Goals are in Settings.</p></section>`;
  }

  // Workouts in the window: totals, by type, minutes over time and a list.
  function activities(W) {
    const list = [];
    W.days.forEach(d => { const r = Store.getDay(d); (r && r.workouts || []).forEach((w, i) => list.push({ d, i, w })); });
    const head = `<div class="row"><h2>Activities</h2><button class="chip" data-act="wo-add" data-date="${W.to}">+ Log workout</button></div>`;
    if (!list.length) return `<section class="section">${head}<p class="sub" style="margin-top:8px">No workouts in this period. They arrive from the Fitness and Health apps through the iPhone Shortcut, or you can log one yourself.</p></section>`;
    const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const mins = list.reduce((n, x) => n + (x.w.min || 0), 0), kcal = list.reduce((n, x) => n + (x.w.kcal || 0), 0), km = list.reduce((n, x) => n + (x.w.km || 0), 0);
    const activeDays = new Set(list.map(x => x.d)).size;
    const types = new Map(); list.forEach(x => { const k = woType(x.w.type), t = types.get(k) || { n: 0, min: 0, km: 0 }; t.n++; t.min += x.w.min || 0; t.km += x.w.km || 0; types.set(k, t); });
    const tRows = [...types].sort((a, b) => b[1].min - a[1].min || b[1].n - a[1].n), tMax = Math.max(1, ...tRows.map(r => r[1].min || r[1].n));

  /* The glowing pill in the tab bar slides to the active section. */
  function moveInd() {
    const ind = $("#tabs .ind"), on = $("#tabs button.on");

    ind.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  }
  /* Numbers in stat tiles count up when a page opens. */
  function countUp(root) {
    if (reduced()) return;
    root.querySelectorAll(".stat b").forEach(el => {
      const txt = el.textContent, m = txt.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(\D*)$/);
      if (!m) return;
      const target = parseFloat(m[2].replace(/,/g, "")), dec = (m[2].split(".")[1] || "").length;
      if (!isFinite(target) || target === 0) return;
      const show = x => x.toLocaleString("en-GB", { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: m[2].includes(",") || target >= 1e4 });
      const t0 = performance.now(), dur = 900;
      const step = now => {
        if (!el.isConnected) return;
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = p < 1 ? m[1] + show(target * e) + m[3] : txt;
        if (p < 1) requestAnimationFrame(step);
      };
      el.textContent = m[1] + show(0) + m[3];
      requestAnimationFrame(step);
    });
  }
  function go(change, dir) {
    flush();
    if (document.startViewTransition && !reduced() && !document.hidden) {
      const h = document.documentElement;
      if (dir) h.classList.add("vt-" + dir);
      const vt = document.startViewTransition(() => { change(); paint(); });
      if (vt.ready) vt.ready.catch(() => {});
      Promise.resolve(vt.finished).catch(() => {}).then(() => h.classList.remove("vt-next", "vt-prev"));
    } else { change(); paint(); }
  }
  /* Theme and highlight changes spread out in a circle from the tap. */
  function reveal(e, fn) {
    if (!document.startViewTransition || reduced() || document.hidden) return fn();
    const h = document.documentElement, x = e && e.clientX ? e.clientX : innerWidth / 2, y = e && e.clientY ? e.clientY : innerHeight / 2;
    h.style.setProperty("--rx", x + "px"); h.style.setProperty("--ry", y + "px");
    h.style.setProperty("--rr", Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + "px");
    h.classList.add("vt-reveal");
    const vt = document.startViewTransition(fn);
    if (vt.ready) vt.ready.catch(() => {});
    Promise.resolve(vt.finished).catch(() => {}).then(() => h.classList.remove("vt-reveal"));
  }

  /* ================= backup ================= */
  function exportData() {
    const blob = new Blob([JSON.stringify(Object.assign({ app: "tracker", version: 2, exportedAt: new Date().toISOString(), days: Store.all(), ideas: Ideas.get() }, ...HOOKS.exportParts.map(f => f())), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `tracker-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  }
  function cleanImport(data) {
    const src = data && typeof data.days === "object" && data.days ? data.days : null;
    if (!src) return null;
    const out = {}, num = (v, max) => (typeof v === "number" && isFinite(v) && v >= 0 && v <= max) ? v : undefined;
    for (const k of Object.keys(src)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !src[k] || typeof src[k] !== "object") continue;
      const r = src[k], rec = { date: k };
      if (typeof r.line === "string" && r.line.trim()) rec.line = r.line.slice(0, 280);
      if (typeof r.newThing === "string" && r.newThing.trim()) rec.newThing = r.newThing.slice(0, 140);
      if ([1, 2, 3, 4, 5].includes(r.mood)) rec.mood = r.mood;
      const h = { sleepMin: num(r.sleepMin, 1440), steps: num(r.steps, 200000), exerciseMin: num(r.exerciseMin, 1440), distanceKm: num(r.distanceKm, 500), activeKcal: num(r.activeKcal, 20000), standH: num(r.standH, 24) };
      HEALTH.forEach(x => { if (h[x] !== undefined) rec[x] = h[x]; });
      const wo = cleanWorkouts(r.workouts); if (wo) rec.workouts = wo;
      rec.updatedAt = typeof r.updatedAt === "string" ? r.updatedAt : new Date().toISOString();
      if (!isBlank(rec)) out[k] = rec;
    }
    return out;
  }
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    let days = null;
    let raw = null;
    try { raw = JSON.parse(await f.text()); days = cleanImport(raw); } catch (err) {}
    if (!days) return toast("That file isn't a Tracker backup.");
    const n = Object.keys(days).length;
    if (!Store.merge(days)) return toast("Couldn't save the imported days.");
    Ideas.merge(raw.ideas);
    HOOKS.importParts.forEach(f => { try { f(raw); } catch (err) {} });
    if (sheet.open) sheet.close();
    paint(); toast(`Imported ${n} day${n === 1 ? "" : "s"}`);
  });

  /* ================= reminder ================= */
  function checkReminder() {
    if (!settings.remindOn) return;
    const now = new Date(), t = today(), [h, m] = (settings.remindAt || "21:00").split(":").map(Number);
    if (now.getHours() * 60 + now.getMinutes() < h * 60 + m) return;
    if (hasLine(Store.getDay(t)) || LS.get("stillday.reminded") === t) return;
    LS.set("stillday.reminded", t);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Tracker", { body: "Don't forget today's line.", icon: "icon-192.png" }); } catch (e) {}
    }
    toast("Don't forget today's line.");
  }
  setInterval(() => { checkReminder(); tickDay(); }, 30000);

  /* ================= events ================= */
  let wipeArmed = false;
  document.addEventListener("click", e => {
    const sub = e.target.closest("[data-sub]");
    if (sub) { if (sub.dataset.sub !== S.tab) go(() => { S.tab = sub.dataset.sub; }); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      const g = tab.dataset.tab, target = g === "journal" ? S.lastJournal : NAV[g][0];
      if (groupOf(S.tab) !== g) go(() => { S.tab = target; }); else window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
      return;
    }
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act;
    if (act !== "wipe") wipeArmed = false;
    if (EXTRA.actions[act]) { EXTRA.actions[act](el, e); return; }
    switch (act) {
      case "prev": go(() => { S.date = addDays(S.date, -1); }, "prev"); break;
      case "next": if (S.date < today()) go(() => { S.date = addDays(S.date, 1); }, "next"); break;
      case "goto-today": go(() => { S.date = today(); }, "next"); break;
      case "open-day": if (el.dataset.date <= today()) go(() => { S.date = el.dataset.date; S.tab = "today"; }); break;
      case "mood": {
        const n = Number(el.dataset.mood), cur = (Store.getDay(S.date) || {}).mood;
        flush();
        showSaved(Store.saveDay(S.date, { mood: cur === n ? null : n }));
        document.querySelectorAll("#moods .mood").forEach(b => { const on = Number(b.dataset.mood) === n && cur !== n; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        break;
      }
      case "year-prev": go(() => { S.year--; }); break;
      case "year-next": if (S.year < new Date().getFullYear()) go(() => { S.year++; }); break;
      case "range": if (S.range !== el.dataset.range) go(() => { S.range = el.dataset.range; S.off = 0; }); break;
      case "dow": go(() => { const i = Number(el.dataset.dow); S.dows = S.dows.includes(i) ? S.dows.filter(x => x !== i) : S.dows.concat(i); }); break;
      case "dow-set": go(() => { const s = el.dataset.set; const next = s ? s.split("").map(Number) : []; S.dows = JSON.stringify(next) === JSON.stringify(S.dows) ? [] : next; }); break;
      case "body-prev": go(() => { S.off++; }, "prev"); break;
      case "body-next": if (S.off > 0) go(() => { S.off--; }, "next"); break;
      case "health": flush(); healthSheet(S.date); break;
      case "health-today": healthSheet(today()); break;
      case "health-day": if (el.dataset.date <= today()) healthSheet(el.dataset.date); break;
      case "health-shift": if (el.dataset.date <= today()) healthSheet(el.dataset.date); break;
      case "wo-add": flush(); woSheet(el.dataset.date || today(), null); break;
      case "wo-edit": flush(); woSheet(el.dataset.date, Number(el.dataset.i)); break;
      case "wo-del": {
        if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Tap again to delete"; break; }
        const list = ((Store.getDay(el.dataset.date) || {}).workouts || []).slice();
        list.splice(Number(el.dataset.i), 1);
        Store.saveDay(el.dataset.date, { workouts: list }); sheet.close(); paint(true); toast("Workout deleted"); break;
      }
      case "catchup": catchupSheet(addDays(today(), -30), addDays(today(), -1)); break;
      case "catchup-year": { const t = today(), end = `${S.year}-12-31` < t ? `${S.year}-12-31` : addDays(t, -1); catchupSheet(`${S.year}-01-01`, end, `Empty days in ${S.year}`); break; }
      case "catch-mood": {
        const d = el.dataset.date, n = Number(el.dataset.mood), cur = (Store.getDay(d) || {}).mood;
        Store.saveDay(d, { mood: cur === n ? null : n }); catchDirty = true;
        el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.mood) === n && cur !== n));
        break;
      }
      case "settings": settingsSheet(); break;
      case "close": sheet.close(); break;
      case "theme": settings.theme = el.dataset.themeOpt; saveSettings(); reveal(e, () => { applyTheme(); settingsSheet(); }); break;
      case "accent": settings.accent = el.dataset.accent; saveSettings(); reveal(e, () => { applyTheme(); settingsSheet(); }); break;
      case "idea": Ideas.toggle(el.dataset.id); paint(true); break;
      case "idea-topic": S.ideaTopic = el.dataset.t; paint(true); break;
      case "mine-done": Ideas.done(el.dataset.id); paint(true); break;
      case "mine-del": Ideas.del(el.dataset.id); paint(true); break;
      case "export": exportData(); break;
      case "import": $("#importFile").click(); break;
      case "wipe":
        if (!wipeArmed) { wipeArmed = true; el.textContent = "Tap again to delete every day"; break; }
        wipeArmed = false; Store.clear(); Ideas.clear(); HOOKS.wipe.forEach(f => f()); sheet.close(); paint(); toast("Everything deleted"); break;
    }
  });
  document.addEventListener("submit", e => {

    if (extraSubmit) { e.preventDefault(); extraSubmit(e.target); return; }
    if (e.target.id === "ideaForm") {

      const f = new FormData(e.target), g = k => String(f.get(k) || "").trim(), num = k => { const v = g(k); return v === "" || !isFinite(Number(v)) || Number(v) < 0 ? undefined : Number(v); };
      const date = g("date"), oldDate = e.target.dataset.date, oldI = e.target.dataset.i;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > today()) return toast("Pick a day up to today.");
      const w = cleanWorkouts([{ type: g("type"), min: num("min"), kcal: num("kcal"), km: num("km"), start: g("start") }]);
      if (!w) return toast("Add the minutes (or kcal or distance).");
      if (oldI !== "") { const ol = ((Store.getDay(oldDate) || {}).workouts || []).slice(); ol.splice(Number(oldI), 1); if (oldDate !== date) Store.saveDay(oldDate, { workouts: ol }); else { ol.splice(Number(oldI), 0, w[0]); Store.saveDay(date, { workouts: ol }); } }
      if (oldI === "" || oldDate !== date) Store.saveDay(date, { workouts: ((Store.getDay(date) || {}).workouts || []).concat(w).sort((a, b) => (a.start || "99") < (b.start || "99") ? -1 : 1) });
      sheet.close(); paint(true); toast("Workout saved");
      return;
    }
    if (e.target.id !== "healthForm") return;
    e.preventDefault();
    const f = new FormData(e.target), n = k => { const v = String(f.get(k) || "").trim(); return v === "" || !isFinite(Number(v)) || Number(v) < 0 ? null : Number(v); };
    const sh = n("sh"), sm = n("sm");
    const ok = Store.saveHealth(e.target.dataset.date, {
      sleepMin: sh == null && sm == null ? null : Math.min(1440, Math.round((sh || 0) * 60 + (sm || 0))),
      steps: n("steps") == null ? null : Math.round(n("steps")),
      exerciseMin: n("ex") == null ? null : Math.round(n("ex")),

    toast(ok ? `Saved for ${fmt(e.target.dataset.date, { day: "numeric", month: "short" })}` : "Couldn't save. Is browser storage blocked or full?");
  });
  document.addEventListener("change", async e => {
    const extraChange = EXTRA.changes[e.target.id];
    if (extraChange) extraChange(e.target);
    if (e.target.id === "rangeFrom" || e.target.id === "rangeTo") {
      const v = e.target.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) go(() => {
        if (e.target.id === "rangeFrom") { S.from = v; if (S.to && S.to < v) S.to = v; } else { S.to = v; if (S.from && S.from > v) S.from = v; }
      });
    }
    if (e.target.id === "healthDate") { const v = e.target.value; if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v <= today()) healthSheet(v); }

    if (e.target.id === "stepGoal") { const v = Math.round(Number(e.target.value)); if (isFinite(v) && v >= 1000 && v <= 50000) { settings.stepGoal = v; saveSettings(); } }
    if (e.target.id === "remindAt") { settings.remindAt = e.target.value || "21:00"; saveSettings(); LS.del("stillday.reminded"); }
    if (e.target.id === "remindOn") {
      settings.remindOn = e.target.checked; saveSettings();

      }

    }
  });
  document.addEventListener("keydown", e => {

      if (next) next.focus(); else e.target.blur();

    }
    // Arrow keys move between days on Today, T jumps back to today (not while typing).
    if (S.tab !== "today" || sheet.open || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest("input, textarea, select"))) return;
    if (e.key === "ArrowLeft") go(() => { S.date = addDays(S.date, -1); }, "prev");

    else if ((e.key === "t" || e.key === "T") && S.date !== today()) go(() => { S.date = today(); }, "next");

  /* Swipe left or right on Today to change day. */
  let swipe = null;
  document.addEventListener("touchstart", e => {

  /* Cards catch a soft light under the mouse. */
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const c = e.target.closest && e.target.closest(".card, .tile, .stat"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });
  window.addEventListener("resize", moveInd);

  /* ================= modules & start ================= */
  window.Stillday = {
    $, esc, pad, ymd, parse, today, addDays, addMonths, fmt, fmtNum, fmtSleep, dayOfYear, daysInYear, LS, toast, openSheet,
    closeSheet: () => { if (sheet.open) sheet.close(); }, paint, ICON, barsHtml, avgOf, Store, Ideas, settings, saveSettings,
    settingsSheet, cleanDays: cleanImport, HOOKS, EXTRA, VIEWS, changed, hasLine
  };

  function start() {
    renderNav();
    applyTheme();
    paint();
    requestAnimationFrame(() => requestAnimationFrame(() => $("#tabs").classList.add("ready")));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
    checkReminder();
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }
  // The module scripts load after this one and register their views first.
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
